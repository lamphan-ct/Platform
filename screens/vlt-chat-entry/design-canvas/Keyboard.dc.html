<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bàn phím iOS</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div aria-hidden="true" style="width: 375px; height: 336px; box-sizing: border-box; padding-top: 3px; display: flex; flex-direction: column; background: #d0d3d9; font-family: -apple-system, 'SF Pro', system-ui, sans-serif; color: #000000">
  <div style="height: 39px; padding: 3px 1px; display: flex; gap: 2px; align-items: center">
    <div style="flex: 1; height: 39px; border-radius: 4.6px; background: #ebedf0; display: grid; place-items: center; font-size: 17px; letter-spacing: -0.4px">“The”</div>
    <div style="width: 1px; height: 25px; margin: 0 2px"></div>
    <div style="flex: 1; height: 39px; display: grid; place-items: center; font-size: 17px; letter-spacing: -0.4px">the</div>
    <div style="width: 1px; height: 25px; margin: 0 2px; background: rgba(0,0,0,0.1)"></div>
    <div style="flex: 1; height: 39px; display: grid; place-items: center; font-size: 17px; letter-spacing: -0.4px">to</div>
  </div>
  <div style="height: 5px"></div>
  <div style="position: relative; height: 204px">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
      <div style="position: absolute; top: {{row.top}}px; left: {{row.inset}}px; right: {{row.inset}}px; display: flex; gap: 6px">
        <sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
          <button tabindex="-1" onClick="{{k.press}}" style="flex: 1; min-width: 0; height: 42px; border: 0; padding: 0 0 6px; border-radius: 4.6px; background: #fcfcfe; box-shadow: 0 1px 0 #898a8d; font-family: inherit; font-size: 25px; line-height: 28px; color: #000000">{{k.label}}</button>
        </sc-for>
      </div>
    </sc-for>
    <button tabindex="-1" onClick="{{shift}}" style="position: absolute; top: 108px; left: 2.85px; width: 42px; height: 42px; border: 0; padding: 0; border-radius: 4.6px; background: #abb0ba; box-shadow: 0 1px 0 #898a8d; display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3 3 10.5h4V17h6v-6.5h4L10 3Z" stroke="#000" stroke-width="1.6" stroke-linejoin="round"></path></svg>
    </button>
    <button tabindex="-1" onClick="{{del}}" style="position: absolute; top: 108px; right: 2.85px; width: 42px; height: 42px; border: 0; padding: 0; border-radius: 4.6px; background: #abb0ba; box-shadow: 0 1px 0 #898a8d; display: grid; place-items: center">
      <svg width="24" height="20" viewBox="0 0 24 20" fill="none"><path d="M8 3h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-6-7 6-7Z" stroke="#000" stroke-width="1.6" stroke-linejoin="round"></path><path d="m11 7 6 6m0-6-6 6" stroke="#000" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
    <button tabindex="-1" style="position: absolute; top: 162px; left: 2.85px; width: 85.5px; height: 42px; border: 0; padding: 0; border-radius: 4.6px; background: #abb0ba; box-shadow: 0 1px 0 #898a8d; font-family: inherit; font-size: 16px; color: #000000">ABC</button>
    <button tabindex="-1" onClick="{{space}}" style="position: absolute; top: 162px; left: 96.4px; width: 182.2px; height: 42px; border: 0; padding: 0; border-radius: 4.6px; background: #fcfcfe; box-shadow: 0 1px 0 #898a8d; font-family: inherit; font-size: 16px; color: #000000">space</button>
    <button tabindex="-1" onClick="{{ret}}" style="position: absolute; top: 162px; right: 2.85px; width: 87.75px; height: 42px; border: 0; padding: 0; border-radius: 4.6px; background: #abb0ba; box-shadow: 0 1px 0 #898a8d; font-family: inherit; font-size: 16px; color: #000000">return</button>
  </div>
  <div style="height: 58px; box-sizing: border-box; padding: 25px 20px 0; display: flex; justify-content: space-between; align-items: flex-start">
    <svg width="27" height="27" viewBox="0 0 27 27" fill="none"><circle cx="13.5" cy="13.5" r="12" stroke="rgba(60,60,67,0.8)" stroke-width="1.8"></circle><circle cx="9.5" cy="11" r="1.4" fill="rgba(60,60,67,0.8)"></circle><circle cx="17.5" cy="11" r="1.4" fill="rgba(60,60,67,0.8)"></circle><path d="M8.5 16c1.2 1.9 2.9 2.8 5 2.8s3.8-.9 5-2.8" stroke="rgba(60,60,67,0.8)" stroke-width="1.8" stroke-linecap="round"></path></svg>
    <svg width="18" height="27" viewBox="0 0 18 27" fill="none"><rect x="5" y="1" width="8" height="15" rx="4" stroke="rgba(60,60,67,0.8)" stroke-width="1.8"></rect><path d="M1.5 12.5a7.5 7.5 0 0 0 15 0M9 20v5" stroke="rgba(60,60,67,0.8)" stroke-width="1.8" stroke-linecap="round"></path></svg>
  </div>
  <div style="position: relative; height: 21px">
    <div style="position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 100px; background: #000000"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onKey":{"editor":null},"$preview":{"width":375,"height":336}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.props.onKey;
    const press = (k) => () => on && on(k);
    const row = (letters, top, inset) => ({ top, inset, keys: [...letters].map((k) => ({ label: k, press: press(k) })) });
    return {
      rows: [row('qwertyuiop', 0, 2.85), row('asdfghjkl', 54, 21.9), row('zxcvbnm', 108, 59.2)],
      shift: press('⇧'), del: press('⌫'), space: press('space'), ret: press('return'),
    };
  }
}
</script>
</body>
</html>
