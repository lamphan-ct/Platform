<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Prototype Treatment 1</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 375px; height: 812px; overflow: hidden; font-family: 'Reddit Sans', sans-serif; color: var(--text-primary); background: var(--background-primary)">
<dc-import name="Screen" mode="{{mode}}" kb="{{kb}}" toast="{{toast}}" cfg="{{cfg}}" msgs="{{msgs}}" on-chat="{{onChat}}" on-view="{{onView}}" on-back="{{onBack}}" on-close="{{onClose}}" on-key="{{onKey}}" hint-size="375px,812px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hasPhone":{"editor":"boolean","default":true,"section":"Kịch bản"},"startChatted":{"editor":"boolean","default":false,"section":"Kịch bản"},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ad', kb: false, sel: [], text: '', callback: true, toast: false, chatted: false, msgs: [] };
  }
  renderVals() {
    const Q = ['Có hợp đồng lao động không', 'Có đóng bảo hiểm không', 'Xin video/hình thực tế ạ', 'Xin vị trí cụ thể nhé sốp', 'Giá còn thương lượng ko ạ?'];
    const hasPhone = this.props.hasPhone ?? true;
    const s = this.state;
    const chatted = s.chatted || (this.props.startChatted ?? false);
    const canSend = s.sel.length > 0 || s.text.trim().length > 0;
    const send = () => {
      if (!canSend) return;
      const msg = { header: s.sel.length > 0, qs: s.sel.slice(), after: s.callback && hasPhone ? ['Gọi lại cho tôi qua SĐT 0987654321'] : [], text: s.text.trim() };
      this.setState({ msgs: s.msgs.concat([msg]), mode: 'ad', kb: false, toast: true, chatted: true });
      clearTimeout(this.tt);
      this.tt = setTimeout(() => this.setState({ toast: false }), 6000);
    };
    const cfg = {
      variant: 't1', selected: s.sel, suggest: Q.filter((q) => !s.sel.includes(q)), text: s.text,
      callback: s.callback, showCb: hasPhone, focus: s.kb,
      onAdd: (q) => this.setState({ sel: s.sel.concat([q]) }),
      onRemove: (q) => this.setState({ sel: s.sel.filter((x) => x !== q) }),
      onText: (e) => this.setState({ text: e.target.value }),
      onFocus: () => this.setState({ kb: true }),
      onToggleCb: () => this.setState({ callback: !s.callback }),
      onSend: send,
    };
    return {
      mode: s.mode, kb: s.kb, toast: s.toast, cfg, msgs: s.msgs,
      onChat: () => chatted ? this.setState({ mode: 'chat', toast: false }) : this.setState({ mode: 'sheet', kb: false, sel: Q.slice(0, 3), text: '', callback: true, toast: false }),
      onView: () => this.setState({ mode: 'chat', toast: false }),
      onBack: () => this.setState({ mode: 'ad' }),
      onClose: () => this.setState({ mode: 'ad', kb: false }),
      onKey: (k) => {
        if (k === 'return') this.setState({ kb: false });
        else if (k === '⌫') this.setState({ text: s.text.slice(0, -1) });
        else if (k === '⇧') return;
        else this.setState({ text: s.text + (k === 'space' ? ' ' : k) });
      },
    };
  }
  componentWillUnmount() { clearTimeout(this.tt); }
}
</script>
</body>
</html>
