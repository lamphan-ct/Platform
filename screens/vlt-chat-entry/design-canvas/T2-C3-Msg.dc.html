<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T2 · Only question, tin đã gửi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 228px; overflow: hidden; box-sizing: border-box; padding: var(--padding-medium-16); display: flex; justify-content: flex-end; align-items: flex-start; background: var(--background-app)">
<dc-import name="Bubble" msg="{{msg}}" hint-size="267px,190px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":228}}'>
class Component extends DCLogic {
  renderVals() {
    return { msg: { tone: 'yellow', header: true, markHeader: true, after: [],
      qs: ['Có hợp đồng lao động không', 'Có hỗ trợ trả góp ko sốp?', 'Có đóng bảo hiểm không', 'Có đóng bảo hiểm không'] } };
  }
}
</script>
</body>
</html>
