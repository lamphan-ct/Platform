<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T1 · Chỉ câu hỏi, tin đã gửi</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 375px; height: 788px; overflow: hidden">
<dc-import name="Screen" t="{{s.t}}" screen="{{s.screen}}" hot="{{s.hot}}" toast="{{s.toast}}" sheet="{{s.sheet}}" kb="{{s.kb}}" sel="{{s.sel}}" text="{{s.text}}" callback="{{s.callback}}" has-phone="{{s.hasPhone}}" msgs="{{s.msgs}}" hint-size="375px,788px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":788}}'>
class Component extends DCLogic {
  renderVals() {
    return { s: { t: 1, screen: 'chat', msgs: [{ qs: ['Có hợp đồng lao động không?', 'Có đóng bảo hiểm không?', 'Xin video/hình thực tế ạ'], text: 'Gọi lại cho mình số 0987654321' }] } };
  }
}
</script>
</body>
</html>
