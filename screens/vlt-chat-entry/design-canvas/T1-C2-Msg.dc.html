<!doctype html>
<html lang="vi">
<head>

<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":354}}'>

    return { msg: { tone: 'yellow', header: true,
      qs: ['Sổ chung hay riêng z ạ?', 'Có đóng bảo hiểm không', 'Xin video/hình thực tế ạ', 'Xin vị trí cụ thể nhé sốp'],

      text: 'Bride Printing Library in London, took a 1914 Cicero translation and scrambled it to make dummy text for Letraset’s Body Type sheets' } };
  }
}
</script>
