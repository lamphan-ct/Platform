<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>T2 · Xoá text input sẵn</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 375px; height: 158px; overflow: hidden">
<dc-import name="ChatSheet" cfg="{{cfg}}" hint-size="375px,150px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":158}}'>
class Component extends DCLogic {
  renderVals() { return { cfg: { variant: 't2', grabber: false, padTop: 12, selected: [], suggest: ['Có hợp đồng lao động không', 'Có hỗ trợ trả góp ko sốp?'], placeholder: '|Nhập tin nhắn…' } }; }
}
</script>
</body>
</html>
