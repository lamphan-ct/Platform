<!doctype html>
<html lang="vi">
<head>

<title>Screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vlt-tokens.css">

<body>

    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: {{sheetBottom}}px">
      <sc-if value="{{isR1}}" hint-placeholder-val="{{false}}">
        <dc-import name="ChatSheetR1" cfg="{{cfg}}" hint-size="375px,320px"></dc-import>
      </sc-if>
      <sc-if value="{{notR1}}" hint-placeholder-val="{{true}}">
        <dc-import name="ChatSheet" cfg="{{cfg}}" hint-size="375px,320px"></dc-import>
      </sc-if>
    </div>
    <sc-if value="{{kb}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0">
        <dc-import name="Keyboard" on-key="{{onKey}}" hint-size="375px,336px"></dc-import>
      </div>
    </sc-if>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["ad","sheet","chat"],"default":"ad"},"kb":{"editor":"boolean","default":false},"hot":{"editor":"boolean","default":false},"toast":{"editor":"boolean","default":false},"cfg":{"editor":null},"msgs":{"editor":null},"onChat":{"editor":null},"onView":{"editor":null},"onBack":{"editor":null},"onClose":{"editor":null},"onKey":{"editor":null},"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mode = p.mode ?? 'ad';
    const kb = !!p.kb;
    const cfg = Object.assign({}, p.cfg || {}, { kb, homeBar: !kb });
    return {
      w: mode === 'chat' ? 390 : 375,
      isAd: mode === 'ad', isChat: mode === 'chat', isSheet: mode === 'sheet',
      isR1: cfg.variant === 'r1', notR1: cfg.variant !== 'r1',
      hot: !!p.hot, toast: !!p.toast, kb, sheetBottom: kb ? 336 : 0, cfg, msgs: p.msgs ?? [],
      onChat: p.onChat, onView: p.onView, onBack: p.onBack, onClose: p.onClose, onKey: p.onKey,
    };
  }
}
</script>
</body>
</html>
