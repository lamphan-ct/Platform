<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khách: Cũ và Mới</title>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --canvas-bg: #f0efed; --canvas-dot: #d6d3cf;
  --chrome-bg: #ffffff; --chrome-border: #e8e8e8; --chrome-text: #222222; --chrome-muted: #8c8c8c; --chrome-hover: rgba(34,34,34,.06);
  --old: #8c8c8c; --new: #306bd9; --new-soft: rgba(48,107,217,.12); --accent: #ffd400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas-bg: #1e1e1f; --canvas-dot: #343436; --chrome-bg: #2a2a2c; --chrome-border: #3a3a3d;
    --chrome-text: #f2f2f2; --chrome-muted: #9a9a9e; --chrome-hover: rgba(255,255,255,.08); --old: #9a9a9e; --new: #6b9bf0; --new-soft: rgba(107,155,240,.16);
  }
}
:root[data-theme="dark"] {
  --canvas-bg: #1e1e1f; --canvas-dot: #343436; --chrome-bg: #2a2a2c; --chrome-border: #3a3a3d;
  --chrome-text: #f2f2f2; --chrome-muted: #9a9a9e; --chrome-hover: rgba(255,255,255,.08); --old: #9a9a9e; --new: #6b9bf0; --new-soft: rgba(107,155,240,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Reddit Sans', system-ui, sans-serif; color: var(--chrome-text); background: var(--canvas-bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }

.viewport { position: fixed; inset: 0; right: 380px; overflow: hidden; touch-action: none; background-color: var(--canvas-bg); background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); }
.viewport.panning { cursor: grab; } .viewport.panning.dragging { cursor: grabbing; }
.viewport.panning iframe { pointer-events: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.frame { position: absolute; }
.frame img.shot { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
.frame.board iframe { pointer-events: none; }
.frame iframe { display: block; border: 0; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
.frame-label { position: absolute; left: 0; bottom: 100%; padding-bottom: 10px; white-space: nowrap; display: flex; gap: 8px; align-items: center; transform-origin: 0 100%; font-size: 14px; line-height: 20px; }
.frame-label b { font-weight: 600; }
.frame-label span { color: var(--chrome-muted); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; }
.tag.old { background: var(--old); } .tag.new { background: var(--new); }
.col-title { position: absolute; transform-origin: 0 100%; font-size: 40px; line-height: 48px; font-weight: 700; white-space: nowrap; }
.col-title small { display: block; font-size: 20px; line-height: 28px; font-weight: 400; color: var(--chrome-muted); }

.mark { position: absolute; pointer-events: none; }
.mark .box { position: absolute; inset: 0; border: 2px solid var(--new); border-radius: 6px; background: transparent; opacity: 0; transition: opacity .2s; }
.mark.old .box { border-color: var(--old); border-style: dashed; }
.mark .pin { position: absolute; right: -14px; top: -14px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: var(--new); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); transform-origin: 14px 14px; pointer-events: auto; cursor: pointer; }
.mark.old .pin { background: var(--old); }
.mark.on .box { opacity: 1; background: var(--new-soft); }
.mark.old.on .box { background: rgba(140,140,140,.12); }
.mark.on .pin { outline: 3px solid var(--chrome-bg); }
.marks-off .mark:not(.on) { display: none; }

/* ---------- Panel ---------- */
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; z-index: 20; background: var(--chrome-bg); border-left: 1px solid var(--chrome-border); display: flex; flex-direction: column; }
.panel-head { padding: 20px 20px 12px; border-bottom: 1px solid var(--chrome-border); }
.panel-head h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
.panel-head p { font-size: 13px; line-height: 18px; color: var(--chrome-muted); margin-top: 4px; }
.legend { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--chrome-muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 4px; vertical-align: -1px; }
.list { flex: 1; overflow-y: auto; padding: 8px; }
.item { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px; border-radius: 12px; transition: background .15s; }
.item:hover { background: var(--chrome-hover); }
.item.on { background: var(--new-soft); }
.item .n { width: 28px; height: 28px; border-radius: 999px; background: var(--new); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.item h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
.item .diff { margin-top: 4px; font-size: 13px; line-height: 18px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.item .diff dt { font-weight: 600; font-size: 11px; line-height: 18px; text-transform: uppercase; letter-spacing: .02em; }
.item .diff dt.o { color: var(--old); } .item .diff dt.w { color: var(--new); }
.item .diff dd { color: var(--chrome-text); }
.item .diff dd.o { color: var(--chrome-muted); }
.panel-foot { padding: 12px 20px; border-top: 1px solid var(--chrome-border); font-size: 12px; line-height: 18px; color: var(--chrome-muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.panel-foot label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--chrome-text); }

.toolbar { position: fixed; left: calc((100vw - 380px) / 2); bottom: 20px; transform: translateX(-50%); z-index: 10; display: flex; gap: 2px; align-items: center; padding: 4px; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.toolbar button { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.toolbar button:hover { background: var(--chrome-hover); }
.toolbar .sep { width: 1px; height: 20px; background: var(--chrome-border); margin: 0 4px; }
.toolbar .zoom { min-width: 56px; font-variant-numeric: tabular-nums; }
.toolbar svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

@media (max-width: 900px) {
  .viewport { right: 0; bottom: 45vh; }
  .panel { top: auto; left: 0; width: auto; height: 45vh; border-left: 0; border-top: 1px solid var(--chrome-border); }
  .toolbar { left: 50%; bottom: calc(45vh + 12px); }
}
</style>
</head>
<body>
<div class="viewport" id="vp"><div class="world" id="world"></div></div>

<aside class="panel" aria-label="Danh sách thay đổi">
  <div class="panel-head">
    <h1>Khách: UI cũ → UI mới</h1>
    <p>Trái: UI đang chạy (ảnh chụp, 1512 × 812). Phải: bản mới, cùng khung 1512 × 812. Bấm một thay đổi để canvas bay tới chỗ đó.</p>
    <div class="legend"><span><i style="background:var(--old)"></i>Cũ</span><span><i style="background:var(--new)"></i>Mới</span></div>
  </div>
  <div class="list" id="list"></div>
  <div class="panel-foot"><label><input type="checkbox" id="allPins" checked> Hiện tất cả số</label><span id="count"></span></div>
</aside>

<div class="toolbar" role="toolbar" aria-label="Điều khiển canvas">
  <button id="tOut" aria-label="Thu nhỏ"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="tZoom" class="zoom" title="Về 100%">100%</button>
  <button id="tIn" aria-label="Phóng to"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <span class="sep"></span>
  <button id="tFit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Vừa màn</button>
  <button id="tPrev" aria-label="Thay đổi trước">‹</button>
  <button id="tNext" aria-label="Thay đổi sau">›</button>
</div>

e:'11:45',phone:null,tags:['new','meet','won'],noteTags:false,posts:['p1','p2'],note:''},\n  {id:3,name:'Nguyễn Thị Mobu',ini:'NM',rating:'4.5',reviews:12,joined:'3 năm trước',unread:true,time:'11:45',phone:'0987651234',tags:['new','meet','hot'],noteTags:false,posts:['p1','p2'],note:''},\n  {id:4,name:'Trần Văn Bình',ini:'TB',rating:'4.8',reviews:30,joined:'5 năm trước',unread:false,time:'Hôm qua',phone:'0912345678',tags:['meet','hot'],noteTags:false,posts:['p3'],note:'Hẹn xem xe thứ 7, 9h sáng'},\n  {id:5,name:'Lê Hoàng Anh',ini:'LA',rating:'4.2',reviews:5,joined:'1 năm trước',unread:false,time:'12/10',phone:null,tags:['won'],noteTags:false,posts:['p2','p3'],note:''},\n  {id:6,name:'Phạm Minh Châu',ini:'MC',rating:'4.6',reviews:8,joined:'2 tháng trước',unread:true,time:'10:20',phone:'0938112233',tags:[],noteTags:false,posts:['p1'],note:''}\n];\nconst f={posts:new Set(),tags:new Set(),unread:false};\nconst $=s=>document.querySelector(s);\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mask=p=>p.slice(0,6)+'****';\n\n/* ===== LABEL_CONFIG — chỉnh ở đây, hoặc qua nút “Cấu hình nhãn”, hoặc URL ?pos=&style=&max=&empty= =====\n   pos   : 'card-top' | 'above-name' | 'below-name' | 'footer'   (đều trong cột Khách hàng)\n   Nhãn: cao 20 = padding 2/4 + chữ label-annotation 10/16 Bold, nền background-tertiary, bo pill, gap 4, icon tag-fill 12.\n   overflow : 'scroll' (1 dòng, crop + scroll ngang) | 'wrap' (xuống dòng) — 'wrap' chỉ áp cho above-name / below-name\n   Luật cố định: mỗi khách tối đa MAX_TAGS nhãn; bấm nhãn mở popover Gắn phân loại.\n   empty : 'add' (hiện chip “+ Phân loại”) | 'hide' (không hiện gì)                                      */\nconst LABEL_CONFIG={pos:'below-name',empty:'add',overflow:'wrap'}; /* chốt: option 3 — dưới tên, xuống dòng */\nconst WRAP_POS=['above-name','below-name']; /* chỉ 2 vị trí này cho phép overflow:'wrap' */\nconst MAX_TAGS=3;\nconst POSITIONS={\n  'card-top':['Hàng đầu card, avatar 20','Nhãn chạy hết chiều ngang cột, avatar thu về 20 cạnh tên. Dòng nhãn rộng nhất.'],\n  'above-name':['Trên tên khách','Như Figma hiện tại. Nhãn đọc trước tên, đẩy tên xuống.'],\n  'below-name':['Dưới tên khách','Tên đọc trước, nhãn là thông tin phụ. Card cao thêm 1 dòng khi có nhãn.'],\n  'footer':['Cuối cột Khách hàng, avatar 20','Avatar thu về 20 cạnh tên. Dưới cụm nút. Tách hẳn khỏi thông tin khách, ít nổi nhất.']\n};\nconst cfg={...LABEL_CONFIG}; /* các option khác đã ẩn — chỉ còn option 3 */\nfunction saveCfg(){return;try{localStorage.setItem('khach-label-cfg',JSON.stringify(cfg))}catch(e){}}\nconst ADD_CHIP=`<button class=\"tag-add t-label-annotation\" data-act=\"addTag\" aria-haspopup=\"dialog\" data-ds=\"Labelling\" data-ds-raw=\"cùng spec với nhãn\"><svg class=\"ds-icon ds-icon--12\" aria-hidden=\"true\"><use href=\"#ds-Plus-outline\"/><\/svg>Phân loại<\/button>`;\nconst isWrap=()=>cfg.overflow==='wrap'&&WRAP_POS.includes(cfg.pos);\nfunction labelSlot(r,pos){\n  if(cfg.pos!==pos)return '';\n  const inner=r.tags.length?labels(r.tags):(cfg.empty==='add'?`<div class=\"labels\">${ADD_CHIP}<\/div>`:'');\n  if(!inner)return '';\n  return pos==='footer'?`<div class=\"foot-labels\">${inner}<\/div>`:inner;\n}\nfunction labels(t){\n  const one=k=>`<button class=\"label t-label-annotation\" data-k=\"${k}\" data-labelling-type=\"${TAGS[k]}\" data-act=\"addTag\" aria-haspopup=\"dialog\" aria-label=\"${TAGS[k]} — sửa phân loại\" data-ds=\"Labelling\"><svg class=\"ds-icon ds-icon--12\" aria-hidden=\"true\"><use href=\"#ds-tag-fill\"/><\/svg><span>${TAGS[k]}<\/span><\/button>`;\n  /* < MAX_TAGS nhãn → vẫn giữ chip “+ Phân loại” ở cuối */\n  return `<div class=\"labels ${isWrap()?'':'is-scroll'}\" data-ds-raw=\"custom: DS chưa có nhãn trạng thái\">${t.map(one).join('')}${t.length<MAX_TAGS?ADD_CHIP:''}<\/div>`;\n}\nfunction postHtml(id){const p=POSTS.find(x=>x.id===id);return `<a class=\"post\" href=\"#\" title=\"${esc(p.title)}\"><span class=\"thumb\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Image-outline\"/><\/svg><\/span><span class=\"post-info\"><span class=\"post-title t-body-section\">${esc(p.title)}<\/span><span class=\"post-price t-tagline-caption\">${p.price}<\/span><\/span><\/a>`}\nfunction phoneBtn(r){\n  if(!r.phone) return '';\n  if(r.revealed) return `<a class=\"btn phone-shown t-label-section\" href=\"tel:${r.phone}\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Phone-outline\"/><\/svg>${r.phone}<\/a>`;\n  return `<button class=\"btn btn--primary btn--wide t-label-section\" data-act=\"reveal\">${mask(r.phone)} Hiện số<\/button>`;\n}\nfunction noteHtml(r){\n  if(r.editing) return `<div class=\"note-edit\"><textarea class=\"t-body-section\" maxlength=\"300\" placeholder=\"Nhập ghi chú về khách này\">${esc(r.note)}<\/textarea><div class=\"btns\"><button class=\"btn btn--secondary t-label-caption\" data-act=\"noteCancel\">Huỷ<\/button><button class=\"btn btn--primary t-label-caption\" data-act=\"noteSave\">Lưu<\/button><\/div><\/div>`;\n  return (r.note?`<button class=\"note-text t-body-section\" style=\"text-align:left\" data-act=\"noteEdit\">${esc(r.note)}<\/button>`:`<button class=\"note-ph t-body-section\" data-act=\"noteEdit\">Nhấn để thêm ghi chú<\/button>`);\n}\nfunction rowHtml(r){\n  return `<article class=\"row grid ${r.unread?'is-unread':''}\" data-id=\"${r.id}\" tabindex=\"0\" aria-label=\"${esc(r.name)}${r.unread?', chưa đọc':''}\" data-ds=\"Intent Row\" data-ds-composite=\"Avatar 48 + Label + Button M-32 + Post item\">\n    <div class=\"col-cust\">\n      <div class=\"grp grp-seller\">\n      ${labelSlot(r,'card-top')}\n      <div class=\"seller-top ${isWrap()?'is-top':''}\">\n        ${['card-top','footer'].includes(cfg.pos)?`<span class=\"ava ava--20\" data-ds=\"Avatar\" data-ds-size=\"20\"><span class=\"t-label-annotation\">${r.ini[0]}<\/span><\/span>`:`<span class=\"ava\"><span class=\"t-label-page\">${r.ini}<\/span><\/span>`}\n        <div class=\"seller-meta\">${labelSlot(r,'above-name')}<div class=\"name-row\"><p class=\"name t-header-caption\">${esc(r.name)}<\/p><\/div>${labelSlot(r,'below-name')}<\/div>\n        <button class=\"more-btn\" data-act=\"more\" aria-label=\"Thêm tuỳ chọn\" aria-haspopup=\"true\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Morevertical-outline\"/><\/svg><\/button>\n      <\/div>\n      <\/div>\n      <div class=\"grp grp-meta\">\n      <div class=\"meta-line meta-rating t-body-section\"><span class=\"rg\"><svg class=\"ds-icon ds-icon--20 star\" aria-hidden=\"true\"><use href=\"#ds-Star-fill\"/><\/svg>${r.rating}<\/span><span class=\"vdiv\"><\/span>${r.reviews} đánh giá<\/div>\n      <div class=\"meta-line t-body-section\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Clock-outline\"/><\/svg><span>Đã tham gia:<\/span><span>${r.joined}<\/span><\/div>\n      <\/div>\n      <div class=\"actions grp-actions\"><button class=\"btn btn--tertiary btn--wide t-label-section\" data-act=\"chat\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Chat-outline\"/><\/svg>Nhắn tin<\/button>${phoneBtn(r)}<\/div>\n      ${labelSlot(r,'footer')}\n    <\/div>\n    <div class=\"col-need\">\n      <div class=\"need-top\">${r.unread?'<span class=\"new-badge t-label-annotation\">Mới<\/span>':''}<span class=\"time t-body-caption\">${r.time}<\/span><\/div>\n      ${NEED.map(n=>`<p class=\"t-tagline-caption\">${n}<\/p>`).join('')}\n    <\/div>\n    <div>${r.posts.map(postHtml).join('')}<\/div>\n    <div>${noteHtml(r)}<\/div>\n  <\/article>`;\n}\nfunction visible(){return rows.filter(r=>(!f.unread||r.unread)&&(!f.posts.size||r.posts.some(p=>f.posts.has(p)))&&(!f.tags.size||r.tags.some(t=>f.tags.has(t))))}\nfunction bindScroll(){document.querySelectorAll('.labels.is-scroll').forEach(el=>{\n  el.addEventListener('wheel',e=>{if(el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});\n})}\nfunction render(){\n  const v=visible();\n  $('#list').innerHTML=v.map(rowHtml).join('');\n  $('#empty').classList.toggle('is-on',!v.length);bindScroll();\n  const n=rows.filter(r=>r.unread).length;\n  $('#railBadge').textContent=n+10; /* 10 = khách chưa đọc ở trang khác (mẫu) */ \n  const ed=$('.note-edit textarea'); if(ed){ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length)}\n}\nfunction chipState(){\n  $('#postsLabel').textContent=f.posts.size?`Tin đăng (${f.posts.size})`:'Tin đăng';\n  $('#tagsLabel').textContent=f.tags.size?`Phân loại (${f.tags.size})`:'Phân loại';\n  document.querySelector('[data-pop=\"popPosts\"]').classList.toggle('is-selected',!!f.posts.size);\n  document.querySelector('[data-pop=\"popTags\"]').classList.toggle('is-selected',!!f.tags.size);\n  $('#unreadChip').classList.toggle('is-selected',f.unread);\n  $('#unreadChip').setAttribute('aria-pressed',f.unread);\n}\nlet toastT;function toast(m){$('#toastText').textContent=m;$('#toast').classList.add('is-on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('is-on'),2400)}\n\n/* popovers */\nlet openPop=null,moreRow=null;\nfunction closePop(){closeTag();if(openPop){openPop.classList.remove('is-open');document.querySelectorAll('[aria-expanded=\"true\"]').forEach(b=>b.setAttribute('aria-expanded','false'));openPop=null}}\nfunction place(pop,anchor,alignRight){const r=anchor.getBoundingClientRect();pop.classList.add('is-open');const w=pop.offsetWidth;pop.style.top=(r.bottom+window.scrollY+4)+'px';pop.style.left=(alignRight?r.right-w:r.left)+window.scrollX+'px';openPop=pop}\nfunction buildFilterPop(id){\n  const pop=$('#'+id),isPosts=id==='popPosts';\n  const items=isPosts?POSTS.map(p=>[p.id,p.title]):Object.entries(TAGS);\n  const set=isPosts?f.posts:f.tags;\n  pop.innerHTML=items.map(([k,t])=>`<button class=\"pop-item t-body-section ${set.has(k)?'is-checked':''}\" data-k=\"${k}\" role=\"menuitemcheckbox\" aria-checked=\"${set.has(k)}\"><span class=\"check\"><svg class=\"ds-icon ds-icon--16\" aria-hidden=\"true\"><use href=\"#ds-Check-outline\"/><\/svg><\/span><span class=\"post-title\" style=\"max-width:260px\">${esc(t)}<\/span><\/button>`).join('');\n  pop.onclick=e=>{const b=e.target.closest('.pop-item');if(!b)return;const k=b.dataset.k;set.has(k)?set.delete(k):set.add(k);b.classList.toggle('is-checked');b.setAttribute('aria-checked',set.has(k));chipState();render()};\n}\ndocument.querySelectorAll('[data-pop]').forEach(btn=>btn.addEventListener('click',e=>{\n  e.stopPropagation();const id=btn.dataset.pop,was=openPop&&openPop.id===id;closePop();if(was)return;\n  buildFilterPop(id);place($('#'+id),btn);btn.setAttribute('aria-expanded','true');\n}));\n$('#unreadChip').onclick=()=>{f.unread=!f.unread;chipState();render()};\n$('#clearFilter').onclick=()=>{f.posts.clear();f.tags.clear();f.unread=false;chipState();render()};\ndocument.addEventListener('click',e=>{if(openPop&&!openPop.contains(e.target))closePop()});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeConfirm()}});\n\nlet draft=null;\nfunction closeTag(){$('#popTag').classList.remove('is-open');document.querySelectorAll('#popMore .is-active,[data-act=\"addTag\"].is-active').forEach(x=>x.classList.remove('is-active'))}\nfunction renderTagList(){\n  const full=draft.size>=MAX_TAGS;\n  $('#tagList').innerHTML=Object.entries(TAGS).map(([k,t])=>{const on=draft.has(k),dis=full&&!on;return `<button class=\"tagopt t-body-page ${on?'is-checked':''}\" data-k=\"${k}\" role=\"checkbox\" aria-checked=\"${on}\" aria-disabled=\"${dis}\"><svg class=\"ds-icon tag-ic\" aria-hidden=\"true\"><use href=\"#ds-tag-fill\"/><\/svg><span class=\"name\">${t}<\/span><span class=\"check\"><svg class=\"ds-icon ds-icon--16\" aria-hidden=\"true\"><use href=\"#ds-Check-outline\"/><\/svg><\/span><\/button>`}).join('');\n  const h=$('#tagHint');h.textContent=`Chọn tối đa ${MAX_TAGS} phân loại (${draft.size}/${MAX_TAGS})`;\n}\nfunction openTag(item,below){\n  draft=new Set(moreRow.tags);renderTagList();\n  const pm=(below?item:$('#popMore')).getBoundingClientRect(),pt=$('#popTag');\n  pt.classList.add('is-open');item.classList.add('is-active');\n  let left=below?pm.left:pm.right+20; if(left+pt.offsetWidth>innerWidth-16) left=below?innerWidth-16-pt.offsetWidth:pm.left-pt.offsetWidth-20; /* ds-raw: 20 = gap-large-20 */\n  let top=below?pm.bottom+8:pm.top; if(top+pt.offsetHeight>innerHeight-16) top=below&&pm.top-pt.offsetHeight-8>=16?pm.top-pt.offsetHeight-8:Math.max(16,innerHeight-16-pt.offsetHeight);\n  pt.style.left=left+scrollX+'px';pt.style.top=top+scrollY+'px';\n  pt.querySelector('.tagopt')?.focus();\n}\n$('#popMore').addEventListener('click',e=>{\n  e.stopPropagation();\n  const b=e.target.closest('.pop-item');if(!b||!moreRow)return;\n  if(b.dataset.act==='openTag'){$('#popTag').classList.contains('is-open')?closeTag():openTag(b)}\n  if(b.dataset.act==='delete'){const r=moreRow;closePop();openConfirm(r)}\n});\n$('#tagList').addEventListener('click',e=>{const b=e.target.closest('.tagopt');if(!b)return;if(b.getAttribute('aria-disabled')==='true'){const h=$('#tagHint');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');return}const k=b.dataset.k;draft.has(k)?draft.delete(k):draft.add(k);renderTagList();$(`.tagopt[data-k=\"${k}\"]`).focus()});\n$('#popTag').addEventListener('click',e=>e.stopPropagation());\n$('#tagSave').onclick=()=>{const r=moreRow,el=$('#tagSave');el.classList.add('is-loading');el.innerHTML='<span class=\"spinner\"><\/span>Đang lưu';\n  setTimeout(()=>{r.tags=Object.keys(TAGS).filter(k=>draft.has(k)).slice(0,MAX_TAGS);el.classList.remove('is-loading');el.textContent='Lưu';closePop();render();toast(r.tags.length?`Đã gắn ${r.tags.length} phân loại cho ${r.name}`:`Đã bỏ phân loại của ${r.name}`)},500)};\n$('#tagManage').onclick=()=>{closePop();toast('Mở trang Quản lý phân loại (chưa thiết kế)')};\n/* row actions */\n$('#list').addEventListener('click',e=>{\n  const rowEl=e.target.closest('.row');if(!rowEl)return;\n  const r=rows.find(x=>x.id==rowEl.dataset.id);const a=e.target.closest('[data-act]');\n  if(e.target.closest('.post')){e.preventDefault();toast('Mở tin: '+e.target.closest('.post').title);return}\n  if(e.target.closest('textarea'))return;\n  if(!a){if(r.unread){r.unread=false;render()}return}\n  e.stopPropagation();\n  const act=a.dataset.act;\n  if(act==='more'){\n    const was=openPop&&openPop.id==='popMore'&&moreRow===r;closePop();if(was)return;moreRow=r;\n    const pm=$('#popMore');place(pm,a,false);pm.style.left=(a.getBoundingClientRect().right-pm.offsetWidth+scrollX)+'px';a.setAttribute('aria-expanded','true');return;\n  }\n  if(act==='addTag'){const was=$('#popTag').classList.contains('is-open')&&moreRow===r;closePop();if(was)return;moreRow=r;openTag(a,true);openPop=$('#popTag');return}\n  if(r.unread){r.unread=false}\n  if(act==='reveal'){a.classList.add('is-loading');a.innerHTML='<span class=\"spinner\"><\/span>Đang hiện số';setTimeout(()=>{r.revealed=true;render();toast('Đã hiện số điện thoại của khách')},700);return}\n  if(act==='chat'){render();toast('Đang mở cuộc trò chuyện với '+r.name);return}\n  if(act==='noteEdit'){rows.forEach(x=>x.editing=false);r.editing=true;render();return}\n  if(act==='noteCancel'){r.editing=false;render();return}\n  if(act==='noteSave'){r.note=rowEl.querySelector('textarea').value.trim();r.editing=false;render();toast(r.note?'Đã lưu ghi chú':'Đã xoá ghi chú');return}\n});\n$('#list').addEventListener('keydown',e=>{\n  if(e.target.matches('textarea')&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.target.closest('.row').querySelector('[data-act=\"noteSave\"]').click()}\n  if(e.target.classList.contains('row')&&e.key==='Enter'){e.target.click()}\n});\n\n/* confirm drawer */\nlet pending=null,lastFocus=null;\nfunction openConfirm(r){pending=r;lastFocus=document.activeElement;$('#cfBody').textContent=`Khách “${r.name}” cùng nhu cầu và ghi chú sẽ bị xoá khỏi danh sách. Bạn không thể hoàn tác thao tác này.`;$('#confirm').classList.add('is-open');$('#cfCancel').focus()}\nfunction closeConfirm(){$('#confirm').classList.remove('is-open');pending=null;lastFocus&&lastFocus.focus&&lastFocus.focus()}\n$('#cfClose').onclick=$('#cfCancel').onclick=closeConfirm;\n$('#confirm').onclick=e=>{if(e.target.id==='confirm')closeConfirm()};\n$('#cfOk').onclick=()=>{const r=pending;if(!r)return;const el=document.querySelector(`.row[data-id=\"${r.id}\"]`);closeConfirm();el&&el.classList.add('is-removing');setTimeout(()=>{rows=rows.filter(x=>x!==r);render();toast('Đã xoá khách hàng')},300)};\n\nfunction renderCfg(){\n  $('#cfgPos').innerHTML='<span class=\"t-label-caption\">Vị trí đặt nhãn<\/span>'+Object.entries(POSITIONS).map(([k,[t,d]],i)=>`<label class=\"opt ${cfg.pos===k?'is-on':''}\"><input type=\"radio\" name=\"pos\" value=\"${k}\" ${cfg.pos===k?'checked':''}><span><span class=\"t-header-caption\">${i+1}. ${t}<\/span><small class=\"t-body-caption\">${d}<\/small><\/span><\/label>`).join('');\n  const seg=(id,key,opts)=>{$(id).innerHTML=opts.map(([v,t])=>`<button class=\"t-tagline-caption ${cfg[key]==v?'is-on':''}\" data-v=\"${v}\" aria-pressed=\"${cfg[key]==v}\">${t}<\/button>`).join('');$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg[key]=key==='max'?+b.dataset.v:b.dataset.v;applyCfg()}};\n  seg('#cfgOverflow','overflow',[['scroll','1 dòng, scroll ngang'],['wrap','Xuống dòng']]);\n  $('#cfgOverflowGroup').hidden=!WRAP_POS.includes(cfg.pos);\n  seg('#cfgEmpty','empty',[['add','Hiện “+ Phân loại”'],['hide','Ẩn']]);\n  $('#cfgCode').textContent='LABEL_CONFIG = '+JSON.stringify(cfg,null,1).replace(/\\n\\s*/g,' ');\n}\nfunction cfgUrl(){const u=new URL(location.href);['pos','empty','overflow'].forEach(k=>u.searchParams.set(k,cfg[k]));return u.toString()}\nfunction applyCfg(){saveCfg();renderCfg();render()}\n$('#cfgPos').addEventListener('change',e=>{cfg.pos=e.target.value;applyCfg()});\n$('#cfgFab').onclick=()=>{const o=$('#cfg').classList.toggle('is-open');$('#cfgFab').setAttribute('aria-expanded',o)};\n$('#cfgClose').onclick=()=>{$('#cfg').classList.remove('is-open');$('#cfgFab').setAttribute('aria-expanded','false')};\n$('#cfgCopy').onclick=async()=>{try{await navigator.clipboard.writeText(cfgUrl());toast('Đã copy link kèm config')}catch(e){toast('Không copy được — dùng URL: ?pos='+cfg.pos+'&empty='+cfg.empty)}};\nrenderCfg();chipState();render();\n<\/script>\n<\/body>\n<\/html>\n"</script>

  ];
  function click(d, sel) { const el = d.querySelector(sel); el && el.click(); }

  /* build frame DOM */
  FRAMES.forEach(f => {
    const el = document.createElement('div'); el.className = 'frame board'; el.id = 'f-' + f.id;
    const lbl = `<div class="frame-label"><span class="tag ${f.v}">${f.v === 'old' ? 'Cũ' : 'Mới'}</span><b>${f.title}</b><span>${f.note}</span></div>`;
    el.innerHTML = lbl + (f.kind === 'img'
      ? `<img class="shot" src="${SRC.old}" width="${f.w}" height="${f.h}" alt="Ảnh chụp UI cũ màn Khách">`
      : `<iframe title="Bản mới: ${f.title}" width="${f.w}" height="${f.h || 900}" tabindex="-1"></iframe>`);
    world.appendChild(el); f.el = el; f.ifr = el.querySelector('iframe');
  });
  for (const v of ['old', 'new']) {
    const t = document.createElement('div'); t.className = 'col-title'; t.style.left = COLX[v] + 'px'; t.style.top = '-200px';
    t.innerHTML = v === 'old' ? 'UI cũ<small>Đang chạy · ảnh chụp người dùng gửi</small>' : 'UI mới<small>Nhãn dưới tên, xuống dòng · tối đa 3 nhãn</small>';
    world.appendChild(t);
  }
  function layout() {
    const GAPY = 200;
    let y = 0;
    for (let r = 0; r < 3; r++) {
      const fs = FRAMES.filter(f => f.row === r);
      fs.forEach(f => { f.x = COLX[f.v]; f.y = y; f.el.style.left = f.x + 'px'; f.el.style.top = y + 'px'; });
      y += Math.max(...fs.map(f => f.hh || f.h || 900)) + GAPY;
    }
    drawMarks();
  }
  /* load iframes */
  const iframes = FRAMES.filter(f => f.ifr);
  let loaded = 0;
  iframes.forEach(f => {
    f.ifr.addEventListener('load', () => {
      const d = f.ifr.contentDocument;
      const size = () => {
        if (!f.h) { const h = Math.max(900, d.documentElement.scrollHeight); if (h !== f.hh) { f.hh = h; f.ifr.height = h; } }
        else f.hh = f.h;
        layout();
      };
      setTimeout(() => { f.setup && f.setup(d); }, 300);
      (d.fonts ? d.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { size(); if (++loaded === iframes.length) fit(); }, 600));
    });
    f.ifr.srcdoc = SRC[f.v];
  });

  /* ---------- Marks ---------- */
  let active = -1;
  const markLayer = document.createElement('div'); world.appendChild(markLayer);
  setTimeout(layout, 0);
  function rectOf(fid, sel) {
    const f = FRAMES.find(x => x.id === fid); if (!f || f.x == null) return null;
    if (typeof sel === 'object') return { x: f.x + sel.x, y: f.y + sel.y, w: sel.w, h: sel.h, v: f.v };
    let el; try { el = f.ifr.contentDocument.querySelector(sel); } catch (e) { return null; }
    if (!el) return null; const r = el.getBoundingClientRect(); if (!r.width && !r.height) return null;
    return { x: f.x + r.left, y: f.y + r.top, w: r.width, h: r.height, v: f.v };
  }
  function drawMarks() {
    markLayer.innerHTML = '';
    CHANGES.forEach((c, i) => c.m.forEach(([fid, sel]) => {
      const r = rectOf(fid, sel); if (!r) return;
      const m = document.createElement('div'); m.className = 'mark ' + r.v + (i === active ? ' on' : '');
      m.style.cssText = `left:${r.x - 4}px;top:${r.y - 4}px;width:${r.w + 8}px;height:${r.h + 8}px`;
      m.innerHTML = `<div class="box"></div><button class="pin" aria-label="Thay đổi ${i + 1}">${i + 1}</button>`;
      m.querySelector('.pin').addEventListener('click', e => { e.stopPropagation(); select(i); });
      markLayer.appendChild(m);
    }));
    scalePins();
  }

  /* ---------- Panel ---------- */
  const list = document.getElementById('list');
  list.innerHTML = CHANGES.map((c, i) => `<button class="item" data-i="${i}"><span class="n">${i + 1}</span><span><h3>${c.t}</h3><dl class="diff"><dt class="o">Cũ</dt><dd class="o">${c.o}</dd><dt class="w">Mới</dt><dd>${c.n}</dd></dl></span></button>`).join('');
  list.addEventListener('click', e => { const b = e.target.closest('.item'); b && select(+b.dataset.i); });
  document.getElementById('count').textContent = CHANGES.length + ' thay đổi';
  document.getElementById('allPins').addEventListener('change', e => vp.classList.toggle('marks-off', !e.target.checked));
  function select(i) {
    active = i; drawMarks();
    list.querySelectorAll('.item').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    list.querySelector(`.item[data-i="${i}"]`).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const rs = CHANGES[i].m.map(([f, s]) => rectOf(f, s)).filter(Boolean); if (!rs.length) return;
    const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y)), x1 = Math.max(...rs.map(r => r.x + r.w)), y1 = Math.max(...rs.map(r => r.y + r.h));
    fitBox(x0, y0, x1 - x0, y1 - y0, 160, 1.2);
  }
  document.getElementById('tPrev').onclick = () => select((active - 1 + CHANGES.length) % CHANGES.length);
  document.getElementById('tNext').onclick = () => select((active + 1) % CHANGES.length);

  /* ---------- Camera ---------- */
  const cam = { x: 40, y: 200, z: .3 }, MIN = .05, MAX = 3;
  const zoomBtn = document.getElementById('tZoom');
  function apply() {
    world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
    const g = 24 * cam.z; vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
    zoomBtn.textContent = Math.round(cam.z * 100) + '%';
    document.querySelectorAll('.frame-label').forEach(l => l.style.transform = `scale(${Math.min(4, 1 / cam.z)})`);
    document.querySelectorAll('.col-title').forEach(l => l.style.transform = `scale(${Math.min(3, Math.max(1, .6 / cam.z))})`);
    scalePins();
  }
  function scalePins() { const s = Math.min(6, 1 / cam.z); document.querySelectorAll('.pin').forEach(p => p.style.transform = `scale(${s})`); }
  function zoomAt(z, cx, cy) { z = Math.min(MAX, Math.max(MIN, z)); cam.x = cx - (cx - cam.x) * (z / cam.z); cam.y = cy - (cy - cam.y) * (z / cam.z); cam.z = z; apply(); }
  let anim;
  function animateTo(t) {
    cancelAnimationFrame(anim); const s = { ...cam }, t0 = performance.now(), D = 380;
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
      cam.x = s.x + (t.x - s.x) * e; cam.y = s.y + (t.y - s.y) * e; cam.z = s.z + (t.z - s.z) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  }
  function fitBox(x, y, w, h, pad, maxZ) {
    const W = vp.clientWidth, H = vp.clientHeight - 80;
    const z = Math.min(maxZ || MAX, (W - pad * 2 / 4) / (w + pad), (H) / (h + pad));
    animateTo({ z, x: (W - w * z) / 2 - x * z, y: (H - h * z) / 2 - y * z + 10 });
  }
  function fit() {
    const xs = FRAMES.map(f => f.x), ys = FRAMES.map(f => f.y);
    const top2 = FRAMES.filter(f => f.row < 2); const x1 = Math.max(...FRAMES.map(f => f.x + f.w)), y1 = Math.max(...top2.map(f => f.y + (f.hh || f.h || 900)));
    fitBox(Math.min(...xs), Math.min(...ys) - 420, x1 - Math.min(...xs), y1 - Math.min(...ys) + 420, 120);
  }
  apply();
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { const r = vp.getBoundingClientRect(); zoomAt(cam.z * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top); }
    else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); }
  }, { passive: false });
  let pan = false, drag = null;
  function setPan(on) { pan = on; vp.classList.toggle('panning', on); }
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); setPan(true); }
    if (e.key === 'ArrowRight' || e.key === 'j') document.getElementById('tNext').click();
    if (e.key === 'ArrowLeft' || e.key === 'k') document.getElementById('tPrev').click();
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') setPan(false); });
  vp.addEventListener('pointerdown', e => {
    if (!(pan || e.button === 1 || e.target === vp || e.target === world)) return;
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; vp.classList.add('panning', 'dragging'); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => { if (!drag) return; cam.x = drag.cx + e.clientX - drag.x; cam.y = drag.cy + e.clientY - drag.y; apply(); });
  vp.addEventListener('pointerup', () => { drag = null; vp.classList.remove('dragging'); if (!pan) vp.classList.remove('panning'); });
  const c = () => ({ x: vp.clientWidth / 2, y: vp.clientHeight / 2 });
  document.getElementById('tIn').onclick = () => zoomAt(cam.z * 1.25, c().x, c().y);
  document.getElementById('tOut').onclick = () => zoomAt(cam.z / 1.25, c().x, c().y);
  zoomBtn.onclick = () => zoomAt(1, c().x, c().y);
  document.getElementById('tFit').onclick = fit;
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
