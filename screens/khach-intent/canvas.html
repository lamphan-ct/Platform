<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khách: Current và New</title>
<link href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --canvas-bg: #f0efed; --canvas-dot: #d6d3cf;
  --chrome-bg: #ffffff; --chrome-border: #e8e8e8; --chrome-text: #222222; --chrome-muted: #8c8c8c; --chrome-hover: rgba(34,34,34,.06);
  --old: #8c8c8c; --new: #306bd9; --new-soft: rgba(48,107,217,.12); --accent: #ffd400;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas-bg: #1e1e1f; --canvas-dot: #343436; --chrome-bg: #2a2a2c; --chrome-border: #3a3a3d;
    --chrome-text: #f2f2f2; --chrome-muted: #9a9a9e; --chrome-hover: rgba(255,255,255,.08); --old: #9a9a9e; --new: #6b9bf0; --new-soft: rgba(107,155,240,.16);
  }
}
:root[data-theme="dark"] {
  --canvas-bg: #1e1e1f; --canvas-dot: #343436; --chrome-bg: #2a2a2c; --chrome-border: #3a3a3d;
  --chrome-text: #f2f2f2; --chrome-muted: #9a9a9e; --chrome-hover: rgba(255,255,255,.08); --old: #9a9a9e; --new: #6b9bf0; --new-soft: rgba(107,155,240,.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Reddit Sans', system-ui, sans-serif; color: var(--chrome-text); background: var(--canvas-bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }

.viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; background-color: var(--canvas-bg); background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); }
.viewport.panning { cursor: grab; } .viewport.panning.dragging { cursor: grabbing; }
.viewport.panning iframe { pointer-events: none; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }

.frame { position: absolute; }
.frame img.shot { display: block; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
.frame.board iframe { pointer-events: none; }
.frame iframe { display: block; border: 0; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
.frame-label { position: absolute; left: 0; bottom: 100%; padding-bottom: 10px; white-space: nowrap; display: flex; gap: 8px; align-items: center; transform-origin: 0 100%; font-size: 14px; line-height: 20px; }
.frame-label b { font-weight: 600; }
.frame-label span { color: var(--chrome-muted); }
.tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #fff; }
.tag.old { background: var(--old); } .tag.new { background: var(--new); }
.col-title { position: absolute; transform-origin: 0 100%; font-size: 40px; line-height: 48px; font-weight: 700; white-space: nowrap; }
.col-title small { display: block; font-size: 20px; line-height: 28px; font-weight: 400; color: var(--chrome-muted); }

.mark { position: absolute; pointer-events: none; }
.mark .box { position: absolute; inset: 0; border: 2px solid var(--new); border-radius: 8px; background: transparent; opacity: .9; transition: opacity .2s; }
.mark.old .box { border-color: var(--old); border-style: dashed; }
.mark .pin { position: absolute; right: -14px; top: -14px; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: var(--new); color: #fff; font-size: 14px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.2); transform-origin: 14px 14px; pointer-events: auto; cursor: pointer; }
.mark.old .pin { background: var(--old); }
.mark.on .box { opacity: 1; border-width: 3px; background: var(--new-soft); }
.mark.old.on .box { background: rgba(140,140,140,.12); }
.mark.on .pin { outline: 3px solid var(--chrome-bg); }
.marks-off .mark:not(.on) { display: none; }

/* ---------- Panel ---------- */
/* bảng ghi chú nằm trên canvas, cạnh artboard New */
.panel { position: absolute; width: 1240px; zoom: 1.5; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); display: flex; flex-direction: column; overflow: hidden; }
.panel-head { padding: 20px 20px 12px; border-bottom: 1px solid var(--chrome-border); }
.panel-head h1 { font-size: 20px; line-height: 28px; font-weight: 600; }
.panel-head p { font-size: 13px; line-height: 18px; color: var(--chrome-muted); margin-top: 4px; }
.legend { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--chrome-muted); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 4px; vertical-align: -1px; }
.list { padding: 8px; columns: 2; column-gap: 16px; }
.list .item { break-inside: avoid; }
.item { width: 100%; text-align: left; cursor: default; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 12px; border-radius: 12px; transition: background .15s; }
.item:hover { background: transparent; }
.item.on { background: transparent; }
.item .n { width: 28px; height: 28px; border-radius: 999px; background: var(--new); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.item h3 { font-size: 14px; line-height: 20px; font-weight: 600; }
.item .diff { margin-top: 4px; font-size: 13px; line-height: 18px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
.item .diff dt { font-weight: 600; font-size: 11px; line-height: 18px; text-transform: uppercase; letter-spacing: .02em; }
.item .diff dt.o { color: var(--old); } .item .diff dt.w { color: var(--new); }
.item .diff dd { color: var(--chrome-text); }
.item .diff dd.o { color: var(--chrome-muted); }
.item .spec { margin-top: 8px; display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12px; line-height: 18px; }
.item .spec dt { color: var(--chrome-muted); }
.item .spec dd { color: var(--chrome-text); }
.item .spec code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--chrome-hover); padding: 0 4px; border-radius: 4px; }
.item .flag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: #fb7328; }
.panel-foot { padding: 12px 20px; border-top: 1px solid var(--chrome-border); font-size: 12px; line-height: 18px; color: var(--chrome-muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.panel-foot label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--chrome-text); }

.toolbar { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10; display: flex; gap: 2px; align-items: center; padding: 4px; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
.toolbar button { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.toolbar button:hover { background: var(--chrome-hover); }
.toolbar .sep { width: 1px; height: 20px; background: var(--chrome-border); margin: 0 4px; }
.toolbar .zoom { min-width: 56px; font-variant-numeric: tabular-nums; }
.toolbar svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.colbox { position: fixed; top: 16px; right: 16px; z-index: 30; width: 300px; padding: 12px 14px; background: var(--chrome-bg); border: 1px solid var(--chrome-border); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.08); font-size: 12px; line-height: 16px; }
.colbox h2 { font-size: 13px; line-height: 18px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.colbox h2 button { font-size: 12px; font-weight: 500; color: var(--new); }
.colbox .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-items: end; }
.colbox label { display: flex; flex-direction: column; gap: 4px; color: var(--chrome-muted); }
.colbox input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--chrome-border); border-radius: 8px; font: inherit; font-size: 14px; color: var(--chrome-text); background: var(--chrome-bg); }
.colbox input:focus { outline: 2px solid var(--new); outline-offset: -1px; }
.colbox .px { color: var(--chrome-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="viewport" id="vp"><div class="world" id="world"></div></div>

<aside class="panel" aria-label="Danh sách thay đổi">
  <div class="panel-head">
    <h1>Ghi chú thay đổi</h1>
    <p>Màn Khách · Current → New</p>
    
  </div>
  <div class="list" id="list"></div>
  <div class="panel-foot"><span></span><span id="count"></span></div>
</aside>

<div class="colbox" aria-label="Tỷ lệ cột">
  <h2>Tỷ lệ cột · New <button id="colReset" title="Về mặc định">25:30:25:20</button></h2>

on>\n<section class=\"cfg\" id=\"cfg\" hidden aria-label=\"Cấu hình nhãn phân loại\" data-ds-context=\"reference\">\n  <div class=\"cfg-head\"><h2 class=\"t-header-section\">Cấu hình nhãn phân loại<\/h2><button class=\"more-btn\" id=\"cfgClose\" aria-label=\"Đóng\"><svg class=\"ds-icon\" aria-hidden=\"true\"><use href=\"#ds-Close-outline\"/><\/svg><\/button><\/div>\n  <div class=\"cfg-body\">\n    <div class=\"cfg-group\" id=\"cfgPos\"><span class=\"t-label-caption\">Vị trí đặt nhãn<\/span><\/div>\n    <div class=\"cfg-group\" id=\"cfgOverflowGroup\"><span class=\"t-label-caption\">Khi nhiều nhãn (chỉ cho vị trí 2 và 3)<\/span><div class=\"seg\" id=\"cfgOverflow\"><\/div><\/div>\n    <div class=\"cfg-group\"><span class=\"t-label-caption\">Card chưa có nhãn<\/span><div class=\"seg\" id=\"cfgEmpty\"><\/div><\/div>\n    <div class=\"cfg-group\"><span class=\"t-label-caption\">Config hiện tại (copy vào LABEL_CONFIG hoặc dùng URL)<\/span><div class=\"cfg-code t-body-caption\" id=\"cfgCode\"><\/div>\n      <button class=\"btn btn--tertiary t-label-section\" id=\"cfgCopy\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Duplicate-outline\"/><\/svg>Copy link với config này<\/button><\/div>\n  <\/div>\n<\/section>\n\n<!-- Prototype tool: tỷ lệ cột (không thuộc màn, ẩn khi nhúng vào canvas) -->\n<button class=\"cfg-fab t-label-section\" id=\"colFab\" aria-expanded=\"false\" aria-controls=\"colCfg\" data-ds-context=\"reference\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Setting-outline\"/><\/svg>Tỷ lệ cột<\/button>\n<section class=\"cfg\" id=\"colCfg\" aria-label=\"Tỷ lệ cột\" data-ds-context=\"reference\">\n  <div class=\"cfg-head\"><h2 class=\"t-header-section\">Tỷ lệ cột<\/h2><button class=\"more-btn\" id=\"colClose\" aria-label=\"Đóng\"><svg class=\"ds-icon\" aria-hidden=\"true\"><use href=\"#ds-Close-outline\"/><\/svg><\/button><\/div>\n  <div class=\"cfg-body\">\n    <div class=\"cfg-group\"><span class=\"t-label-caption\">Nhập số cho từng cột (tỷ lệ tương đối, không cần cộng đủ 100)<\/span>\n      <div class=\"colcfg-row\" id=\"colInputs\"><\/div><\/div>\n    <div class=\"cfg-group\"><span class=\"t-label-caption\">Kết quả<\/span><div class=\"cfg-code t-body-caption\" id=\"colOut\"><\/div><\/div>\n    <div class=\"seg\"><button class=\"t-tagline-caption\" id=\"colReset\">Về 25 : 30 : 25 : 20<\/button><button class=\"t-tagline-caption\" id=\"colCopy\">Copy link<\/button><\/div>\n  <\/div>\n<\/section>\n\n<div class=\"toast t-body-section\" id=\"toast\" role=\"status\" aria-live=\"polite\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-CircleCheck-fill\"/><\/svg><span id=\"toastText\"><\/span><\/div>\n\n<!-- icon templates referenced from JS (giữ để ds_icons.py nhúng symbol) -->\n<template id=\"tplIcons\">\n  <use href=\"#ds-tag-fill\"/><use href=\"#ds-Star-fill\"/><use href=\"#ds-Clock-outline\"/><use href=\"#ds-Morevertical-outline\"/>\n  <use href=\"#ds-Image-outline\"/><use href=\"#ds-tag-outline\"/><use href=\"#ds-Plus-outline\"/><use href=\"#ds-Phone-outline\"/><use href=\"#ds-Hide-outline\"/>\n<\/template>\n\n<script>\nconst TAGS={new:'Khách mới',meet:'Hẹn gặp',won:'Đã chốt',hot:'Quan tâm cao',vip:'Khách VIP'};\nconst POSTS=[\n  {id:'p1',title:'TUDIO BANCOL THOÁNG MÁT NGAY PHAN ĐĂNG LƯU GIÁP BÌNH THẠNH',price:'7 tỷ'},\n  {id:'p2',title:'CĂN HỘ STUDIO BANCOL FULL NỘI THẤT QUẬN 3',price:'5 triệu/tháng'},\n  {id:'p3',title:'VinFast VF e34 2023 lướt 8.000 km',price:'520 triệu'}\n];\nconst NEED=['Mua Ô tô (Điện) cũ, khu vực TPHCM, Vũng Tàu, Bình Dương','Thương hiệu Vinfast, Honda, Porsche đời 2024, 2023, 2022','Ngân sách từ 450 - 550 triệu','Khách đã xem 10 tin đăng, đã liên hệ 5 người bán ở khu vực TPHCM, Vũng Tàu, Bình Dương trong 7 ngày qua','Khách đã lấy SĐT để liên hệ trực tiếp'];\nlet rows=[\n  {id:1,hi:['phone','active'],name:'Nguyễn Thị Mobu',ini:'NM',rating:'4.5',reviews:12,joined:'3 năm trước',unread:true,time:'11:45',phone:'0987654321',tags:['new','meet','won'],noteTags:false,posts:['p1','p2'],note:''},\n  {id:2,hi:['active'],name:'Nguyễn Thị Mobu',ini:'NM',rating:'4.5',reviews:12,joined:'3 năm trước',unread:false,time:'11:45',phone:null,tags:['new','meet'],noteTags:false,posts:['p1','p2'],note:''},\n  {id:3,hi:['phone','new24'],name:'Nguyễn Thị Mobu',ini:'NM',rating:'4.5',reviews:12,joined:'3 năm trước',unread:true,time:'11:45',phone:'0987651234',tags:['new','meet','hot'],noteTags:false,posts:['p1','p2'],note:''},\n  {id:4,hi:['back'],name:'Trần Văn Bình',ini:'TB',rating:'4.8',reviews:30,joined:'5 năm trước',unread:false,time:'Hôm qua',phone:'0912345678',tags:['meet','hot'],noteTags:false,posts:['p3'],note:'Hẹn xem xe thứ 7, 9h sáng'},\n  {id:5,hi:[],name:'Lê Hoàng Anh',ini:'LA',rating:'4.2',reviews:5,joined:'1 năm trước',unread:false,time:'12/10',phone:null,tags:['won'],noteTags:false,posts:['p2','p3'],note:''},\n  {id:6,hi:['new24'],name:'Phạm Minh Châu',ini:'MC',rating:'4.6',reviews:8,joined:'2 tháng trước',unread:true,time:'10:20',phone:'0938112233',tags:[],noteTags:false,posts:['p1'],note:''}\n];\n/* Nổi bật: danh sách lựa chọn là đề xuất (data-ds-speculative) — cần PM/designer chốt */\nconst HI={phone:'Đã lấy SĐT',active:'Liên hệ nhiều người bán',back:'Quay lại xem tin',new24:'Mới trong 24 giờ'};\nconst f={posts:new Set(),tags:new Set(),hi:new Set(),unread:false};\nconst $=s=>document.querySelector(s);\nconst esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst mask=p=>p.slice(0,6)+'****';\n\n/* ===== LABEL_CONFIG — chỉnh ở đây, hoặc qua nút “Cấu hình nhãn”, hoặc URL ?pos=&style=&max=&empty= =====\n   pos   : 'card-top' | 'above-name' | 'below-name' | 'footer'   (đều trong cột Khách hàng)\n   Nhãn: cao 20 = padding 2/4 + chữ label-annotation 10/16 Bold, nền background-tertiary, bo pill, gap 4, icon tag-fill 12.\n   overflow : 'scroll' (1 dòng, crop + scroll ngang) | 'wrap' (xuống dòng) — 'wrap' chỉ áp cho above-name / below-name\n   Luật cố định: mỗi khách tối đa MAX_TAGS nhãn; bấm nhãn mở popover Gắn phân loại.\n   empty : 'add' (hiện chip “+ Phân loại”) | 'hide' (không hiện gì)                                      */\nconst LABEL_CONFIG={pos:'below-name',empty:'add',overflow:'wrap'}; /* chốt: option 3 — dưới tên, xuống dòng */\nconst WRAP_POS=['above-name','below-name']; /* chỉ 2 vị trí này cho phép overflow:'wrap' */\nconst MAX_TAGS=3;\nconst POSITIONS={\n  'card-top':['Hàng đầu card, avatar 20','Nhãn chạy hết chiều ngang cột, avatar thu về 20 cạnh tên. Dòng nhãn rộng nhất.'],\n  'above-name':['Trên tên khách','Như Figma hiện tại. Nhãn đọc trước tên, đẩy tên xuống.'],\n  'below-name':['Dưới tên khách','Tên đọc trước, nhãn là thông tin phụ. Card cao thêm 1 dòng khi có nhãn.'],\n  'footer':['Cuối cột Khách hàng, avatar 20','Avatar thu về 20 cạnh tên. Dưới cụm nút. Tách hẳn khỏi thông tin khách, ít nổi nhất.']\n};\nconst cfg={...LABEL_CONFIG}; /* các option khác đã ẩn — chỉ còn option 3 */\nfunction saveCfg(){return;try{localStorage.setItem('khach-label-cfg',JSON.stringify(cfg))}catch(e){}}\nconst ADD_CHIP=`<button class=\"tag-add t-label-annotation\" data-act=\"addTag\" aria-haspopup=\"dialog\" data-ds=\"Labelling\" data-ds-raw=\"cùng spec với nhãn\"><svg class=\"ds-icon ds-icon--12\" aria-hidden=\"true\"><use href=\"#ds-Plus-outline\"/><\/svg>Phân loại<\/button>`;\nconst isWrap=()=>cfg.overflow==='wrap'&&WRAP_POS.includes(cfg.pos);\nfunction labelSlot(r,pos){\n  if(cfg.pos!==pos)return '';\n  const inner=r.tags.length?labels(r.tags):(cfg.empty==='add'?`<div class=\"labels\">${ADD_CHIP}<\/div>`:'');\n  if(!inner)return '';\n  return pos==='footer'?`<div class=\"foot-labels\">${inner}<\/div>`:inner;\n}\nfunction labels(t){\n  const one=k=>`<button class=\"label t-label-annotation\" data-k=\"${k}\" data-labelling-type=\"${TAGS[k]}\" data-act=\"addTag\" aria-haspopup=\"dialog\" aria-label=\"${TAGS[k]} — sửa phân loại\" data-ds=\"Labelling\"><svg class=\"ds-icon ds-icon--12\" aria-hidden=\"true\"><use href=\"#ds-tag-fill\"/><\/svg><span>${TAGS[k]}<\/span><\/button>`;\n  /* < MAX_TAGS nhãn → vẫn giữ chip “+ Phân loại” ở cuối */\n  return `<div class=\"labels ${isWrap()?'':'is-scroll'}\" data-ds-raw=\"custom: DS chưa có nhãn trạng thái\">${t.map(one).join('')}${t.length<MAX_TAGS?ADD_CHIP:''}<\/div>`;\n}\nfunction postHtml(id){const p=POSTS.find(x=>x.id===id);return `<a class=\"post\" href=\"#\" title=\"${esc(p.title)}\"><span class=\"thumb\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Image-outline\"/><\/svg><\/span><span class=\"post-info\"><span class=\"post-title t-body-section\">${esc(p.title)}<\/span><span class=\"post-price t-tagline-caption\">${p.price}<\/span><\/span><\/a>`}\nfunction phoneBtn(r){\n  if(!r.phone) return '';\n  if(r.revealed) return `<a class=\"btn phone-shown t-label-section\" href=\"tel:${r.phone}\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Phone-outline\"/><\/svg>${r.phone}<\/a>`;\n  return `<button class=\"btn btn--primary btn--wide t-label-section\" data-act=\"reveal\">${mask(r.phone)} Hiện số<\/button>`;\n}\nfunction noteHtml(r){\n  if(r.editing) return `<div class=\"note-edit\"><textarea class=\"t-body-section\" maxlength=\"300\" placeholder=\"Nhập ghi chú về khách này\">${esc(r.note)}<\/textarea><div class=\"btns\"><button class=\"btn btn--secondary t-label-caption\" data-act=\"noteCancel\">Huỷ<\/button><button class=\"btn btn--primary t-label-caption\" data-act=\"noteSave\">Lưu<\/button><\/div><\/div>`;\n  return (r.note?`<button class=\"note-text t-body-section\" style=\"text-align:left\" data-act=\"noteEdit\">${esc(r.note)}<\/button>`:`<button class=\"note-ph t-body-section\" data-act=\"noteEdit\">Nhấn để thêm ghi chú<\/button>`);\n}\nfunction rowHtml(r){\n  return `<article class=\"row grid ${r.unread?'is-unread':''}\" data-id=\"${r.id}\" tabindex=\"0\" aria-label=\"${esc(r.name)}${r.unread?', chưa đọc':''}\" data-ds=\"Intent Row\" data-ds-composite=\"Avatar 48 + Label + Button M-32 + Post item\">\n    <div class=\"col-cust\">\n      <div class=\"grp grp-seller\">\n      ${labelSlot(r,'card-top')}\n      <div class=\"seller-top ${isWrap()?'is-top':''}\">\n        ${['card-top','footer'].includes(cfg.pos)?`<span class=\"ava ava--20\" data-ds=\"Avatar\" data-ds-size=\"20\"><span class=\"t-label-annotation\">${r.ini[0]}<\/span><\/span>`:`<span class=\"ava\"><span class=\"t-label-page\">${r.ini}<\/span><\/span>`}\n        <div class=\"seller-meta\">${labelSlot(r,'above-name')}<div class=\"name-row\"><p class=\"name t-header-caption\">${esc(r.name)}<\/p><\/div>${labelSlot(r,'below-name')}<\/div>\n        <button class=\"more-btn\" data-act=\"more\" aria-label=\"Thêm tuỳ chọn\" aria-haspopup=\"true\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Morevertical-outline\"/><\/svg><\/button>\n      <\/div>\n      <\/div>\n      <div class=\"grp grp-meta\">\n      <div class=\"meta-line meta-rating t-body-section\"><span class=\"rg\"><svg class=\"ds-icon ds-icon--20 star\" aria-hidden=\"true\"><use href=\"#ds-Star-fill\"/><\/svg>${r.rating}<\/span><span class=\"vdiv\"><\/span>${r.reviews} đánh giá<\/div>\n      <div class=\"meta-line t-body-section\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Clock-outline\"/><\/svg><span>Đã tham gia:<\/span><span>${r.joined}<\/span><\/div>\n      <\/div>\n      <div class=\"actions grp-actions\"><button class=\"btn btn--tertiary btn--wide t-label-section\" data-act=\"chat\"><svg class=\"ds-icon ds-icon--20\" aria-hidden=\"true\"><use href=\"#ds-Chat-outline\"/><\/svg>Nhắn tin<\/button>${phoneBtn(r)}<\/div>\n      ${labelSlot(r,'footer')}\n    <\/div>\n    <div class=\"col-need\">\n      <div class=\"need-top\">${r.unread?'<span class=\"new-badge t-label-annotation\">Mới<\/span>':''}<span class=\"time t-body-caption\">${r.time}<\/span><\/div>\n      ${NEED.map(n=>`<p class=\"t-tagline-caption\">${n}<\/p>`).join('')}\n    <\/div>\n    <div>${r.posts.map(postHtml).join('')}<\/div>\n    <div>${noteHtml(r)}<\/div>\n  <\/article>`;\n}\nfunction visible(){return rows.filter(r=>(!f.unread||r.unread)&&(!f.posts.size||r.posts.some(p=>f.posts.has(p)))&&(!f.tags.size||r.tags.some(t=>f.tags.has(t)))&&(!f.hi.size||(r.hi||[]).some(h=>f.hi.has(h))))}\nfunction bindScroll(){document.querySelectorAll('.labels.is-scroll').forEach(el=>{\n  el.addEventListener('wheel',e=>{if(el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});\n})}\nfunction render(){\n  const v=visible();\n  $('#list').innerHTML=v.map(rowHtml).join('');\n  $('#empty').classList.toggle('is-on',!v.length);bindScroll();\n  const n=rows.filter(r=>r.unread).length;\n  $('#railBadge').textContent=n+10; /* 10 = khách chưa đọc ở trang khác (mẫu) */ \n  const ed=$('.note-edit textarea'); if(ed){ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length)}\n}\nfunction chipState(){\n  $('#postsLabel').textContent=f.posts.size?`Tin đăng (${f.posts.size})`:'Tin đăng';\n  $('#tagsLabel').textContent=f.tags.size?`Phân loại (${f.tags.size})`:'Phân loại';\n  document.querySelector('[data-pop=\"popPosts\"]').classList.toggle('is-selected',!!f.posts.size);\n  document.querySelector('[data-pop=\"popTags\"]').classList.toggle('is-selected',!!f.tags.size);\n  $('#hiLabel').textContent=f.hi.size?`Nổi bật (${f.hi.size})`:'Nổi bật';\n  document.querySelector('[data-pop=\"popHi\"]').classList.toggle('is-selected',!!f.hi.size);\n  $('#unreadChip').classList.toggle('is-selected',f.unread);\n  $('#unreadChip').setAttribute('aria-pressed',f.unread);\n}\nlet toastT;function toast(m){$('#toastText').textContent=m;$('#toast').classList.add('is-on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('is-on'),2400)}\n\n/* popovers */\nlet openPop=null,moreRow=null;\nfunction closePop(){closeTag();if(openPop){openPop.classList.remove('is-open');document.querySelectorAll('[aria-expanded=\"true\"]').forEach(b=>b.setAttribute('aria-expanded','false'));openPop=null}}\nfunction place(pop,anchor,alignRight){const r=anchor.getBoundingClientRect();pop.classList.add('is-open');const w=pop.offsetWidth;pop.style.top=(r.bottom+window.scrollY+4)+'px';pop.style.left=(alignRight?r.right-w:r.left)+window.scrollX+'px';openPop=pop}\nfunction buildFilterPop(id){\n  const pop=$('#'+id),isPosts=id==='popPosts',isHi=id==='popHi';\n  const items=isPosts?POSTS.map(p=>[p.id,p.title]):Object.entries(isHi?HI:TAGS);\n  const set=isPosts?f.posts:isHi?f.hi:f.tags;\n  pop.innerHTML=items.map(([k,t])=>`<button class=\"pop-item t-body-section ${set.has(k)?'is-checked':''}\" data-k=\"${k}\" role=\"menuitemcheckbox\" aria-checked=\"${set.has(k)}\"><span class=\"check\"><svg class=\"ds-icon ds-icon--16\" aria-hidden=\"true\"><use href=\"#ds-Check-outline\"/><\/svg><\/span><span class=\"post-title\" style=\"max-width:260px\">${esc(t)}<\/span><\/button>`).join('');\n  pop.onclick=e=>{const b=e.target.closest('.pop-item');if(!b)return;const k=b.dataset.k;set.has(k)?set.delete(k):set.add(k);b.classList.toggle('is-checked');b.setAttribute('aria-checked',set.has(k));chipState();render()};\n}\ndocument.querySelectorAll('[data-pop]').forEach(btn=>btn.addEventListener('click',e=>{\n  e.stopPropagation();const id=btn.dataset.pop,was=openPop&&openPop.id===id;closePop();if(was)return;\n  buildFilterPop(id);place($('#'+id),btn);btn.setAttribute('aria-expanded','true');\n}));\n$('#unreadChip').onclick=()=>{f.unread=!f.unread;chipState();render()};\n$('#clearFilter').onclick=()=>{f.posts.clear();f.tags.clear();f.hi.clear();f.unread=false;chipState();render()};\ndocument.addEventListener('click',e=>{if(openPop&&!openPop.contains(e.target))closePop()});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeConfirm()}});\n\nlet draft=null;\nfunction closeTag(){$('#popTag').classList.remove('is-open');document.querySelectorAll('#popMore .is-active,[data-act=\"addTag\"].is-active').forEach(x=>x.classList.remove('is-active'))}\nfunction renderTagList(){\n  const full=draft.size>=MAX_TAGS;\n  $('#tagList').innerHTML=Object.entries(TAGS).map(([k,t])=>{const on=draft.has(k),dis=full&&!on;return `<button class=\"tagopt t-body-page ${on?'is-checked':''}\" data-k=\"${k}\" role=\"checkbox\" aria-checked=\"${on}\" aria-disabled=\"${dis}\"><svg class=\"ds-icon tag-ic\" aria-hidden=\"true\"><use href=\"#ds-tag-fill\"/><\/svg><span class=\"name\">${t}<\/span><span class=\"check\"><svg class=\"ds-icon ds-icon--16\" aria-hidden=\"true\"><use href=\"#ds-Check-outline\"/><\/svg><\/span><\/button>`}).join('');\n  const h=$('#tagHint');h.textContent=`Chọn tối đa ${MAX_TAGS} phân loại (${draft.size}/${MAX_TAGS})`;\n}\nfunction openTag(item,below){\n  draft=new Set(moreRow.tags);renderTagList();\n  const pm=(below?item:$('#popMore')).getBoundingClientRect(),pt=$('#popTag');\n  pt.classList.add('is-open');item.classList.add('is-active');\n  let left=below?pm.left:pm.right+20; if(left+pt.offsetWidth>innerWidth-16) left=below?innerWidth-16-pt.offsetWidth:pm.left-pt.offsetWidth-20; /* ds-raw: 20 = gap-large-20 */\n  let top=below?pm.bottom+8:pm.top; if(top+pt.offsetHeight>innerHeight-16) top=below&&pm.top-pt.offsetHeight-8>=16?pm.top-pt.offsetHeight-8:Math.max(16,innerHeight-16-pt.offsetHeight);\n  pt.style.left=left+scrollX+'px';pt.style.top=top+scrollY+'px';\n  pt.querySelector('.tagopt')?.focus();\n}\n$('#popMore').addEventListener('click',e=>{\n  e.stopPropagation();\n  const b=e.target.closest('.pop-item');if(!b||!moreRow)return;\n  if(b.dataset.act==='openTag'){$('#popTag').classList.contains('is-open')?closeTag():openTag(b)}\n  if(b.dataset.act==='delete'){const r=moreRow;closePop();openConfirm(r)}\n});\n$('#tagList').addEventListener('click',e=>{const b=e.target.closest('.tagopt');if(!b)return;if(b.getAttribute('aria-disabled')==='true'){const h=$('#tagHint');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');return}const k=b.dataset.k;draft.has(k)?draft.delete(k):draft.add(k);renderTagList();$(`.tagopt[data-k=\"${k}\"]`).focus()});\n$('#popTag').addEventListener('click',e=>e.stopPropagation());\n$('#tagSave').onclick=()=>{const r=moreRow,el=$('#tagSave');el.classList.add('is-loading');el.innerHTML='<span class=\"spinner\"><\/span>Đang lưu';\n  setTimeout(()=>{r.tags=Object.keys(TAGS).filter(k=>draft.has(k)).slice(0,MAX_TAGS);el.classList.remove('is-loading');el.textContent='Lưu';closePop();render();toast(r.tags.length?`Đã gắn ${r.tags.length} phân loại cho ${r.name}`:`Đã bỏ phân loại của ${r.name}`)},500)};\n$('#tagManage').onclick=()=>{closePop();toast('Mở trang Quản lý phân loại (chưa thiết kế)')};\n/* row actions */\n$('#list').addEventListener('click',e=>{\n  const rowEl=e.target.closest('.row');if(!rowEl)return;\n  const r=rows.find(x=>x.id==rowEl.dataset.id);const a=e.target.closest('[data-act]');\n  if(e.target.closest('.post')){e.preventDefault();toast('Mở tin: '+e.target.closest('.post').title);return}\n  if(e.target.closest('textarea'))return;\n  if(!a){if(r.unread){r.unread=false;render()}return}\n  e.stopPropagation();\n  const act=a.dataset.act;\n  if(act==='more'){\n    const was=openPop&&openPop.id==='popMore'&&moreRow===r;closePop();if(was)return;moreRow=r;\n    const pm=$('#popMore');place(pm,a,false);pm.style.left=(a.getBoundingClientRect().right-pm.offsetWidth+scrollX)+'px';a.setAttribute('aria-expanded','true');return;\n  }\n  if(act==='addTag'){const was=$('#popTag').classList.contains('is-open')&&moreRow===r;closePop();if(was)return;moreRow=r;openTag(a,true);openPop=$('#popTag');return}\n  if(r.unread){r.unread=false}\n  if(act==='reveal'){a.classList.add('is-loading');a.innerHTML='<span class=\"spinner\"><\/span>Đang hiện số';setTimeout(()=>{r.revealed=true;render();toast('Đã hiện số điện thoại của khách')},700);return}\n  if(act==='chat'){render();toast('Đang mở cuộc trò chuyện với '+r.name);return}\n  if(act==='noteEdit'){rows.forEach(x=>x.editing=false);r.editing=true;render();return}\n  if(act==='noteCancel'){r.editing=false;render();return}\n  if(act==='noteSave'){r.note=rowEl.querySelector('textarea').value.trim();r.editing=false;render();toast(r.note?'Đã lưu ghi chú':'Đã xoá ghi chú');return}\n});\n$('#list').addEventListener('keydown',e=>{\n  if(e.target.matches('textarea')&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.target.closest('.row').querySelector('[data-act=\"noteSave\"]').click()}\n  if(e.target.classList.contains('row')&&e.key==='Enter'){e.target.click()}\n});\n\n/* confirm drawer */\nlet pending=null,lastFocus=null;\nfunction openConfirm(r){pending=r;lastFocus=document.activeElement;$('#cfBody').textContent=`Khách “${r.name}” cùng nhu cầu và ghi chú sẽ bị xoá khỏi danh sách. Bạn không thể hoàn tác thao tác này.`;$('#confirm').classList.add('is-open');$('#cfCancel').focus()}\nfunction closeConfirm(){$('#confirm').classList.remove('is-open');pending=null;lastFocus&&lastFocus.focus&&lastFocus.focus()}\n$('#cfClose').onclick=$('#cfCancel').onclick=closeConfirm;\n$('#confirm').onclick=e=>{if(e.target.id==='confirm')closeConfirm()};\n$('#cfOk').onclick=()=>{const r=pending;if(!r)return;const el=document.querySelector(`.row[data-id=\"${r.id}\"]`);closeConfirm();el&&el.classList.add('is-removing');setTimeout(()=>{rows=rows.filter(x=>x!==r);render();toast('Đã xoá khách hàng')},300)};\n\nfunction renderCfg(){\n  $('#cfgPos').innerHTML='<span class=\"t-label-caption\">Vị trí đặt nhãn<\/span>'+Object.entries(POSITIONS).map(([k,[t,d]],i)=>`<label class=\"opt ${cfg.pos===k?'is-on':''}\"><input type=\"radio\" name=\"pos\" value=\"${k}\" ${cfg.pos===k?'checked':''}><span><span class=\"t-header-caption\">${i+1}. ${t}<\/span><small class=\"t-body-caption\">${d}<\/small><\/span><\/label>`).join('');\n  const seg=(id,key,opts)=>{$(id).innerHTML=opts.map(([v,t])=>`<button class=\"t-tagline-caption ${cfg[key]==v?'is-on':''}\" data-v=\"${v}\" aria-pressed=\"${cfg[key]==v}\">${t}<\/button>`).join('');$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;cfg[key]=key==='max'?+b.dataset.v:b.dataset.v;applyCfg()}};\n  seg('#cfgOverflow','overflow',[['scroll','1 dòng, scroll ngang'],['wrap','Xuống dòng']]);\n  $('#cfgOverflowGroup').hidden=!WRAP_POS.includes(cfg.pos);\n  seg('#cfgEmpty','empty',[['add','Hiện “+ Phân loại”'],['hide','Ẩn']]);\n  $('#cfgCode').textContent='LABEL_CONFIG = '+JSON.stringify(cfg,null,1).replace(/\\n\\s*/g,' ');\n}\nfunction cfgUrl(){const u=new URL(location.href);['pos','empty','overflow'].forEach(k=>u.searchParams.set(k,cfg[k]));return u.toString()}\nfunction applyCfg(){saveCfg();renderCfg();render()}\n$('#cfgPos').addEventListener('change',e=>{cfg.pos=e.target.value;applyCfg()});\n$('#cfgFab').onclick=()=>{const o=$('#cfg').classList.toggle('is-open');$('#cfgFab').setAttribute('aria-expanded',o)};\n$('#cfgClose').onclick=()=>{$('#cfg').classList.remove('is-open');$('#cfgFab').setAttribute('aria-expanded','false')};\n$('#cfgCopy').onclick=async()=>{try{await navigator.clipboard.writeText(cfgUrl());toast('Đã copy link kèm config')}catch(e){toast('Không copy được — dùng URL: ?pos='+cfg.pos+'&empty='+cfg.empty)}};\n/* ===== Tỷ lệ cột — điền trực tiếp, lưu theo trình duyệt, chia sẻ qua ?cols=20,35,35,20 ===== */\nconst COL_NAMES=['Khách hàng','Nhu cầu','Tin khách quan tâm','Ghi chú'],COL_DEFAULT=[25,30,25,20];\nlet cols=(()=>{const q=new URLSearchParams(location.search).get('cols');let v=q?q.split(',').map(Number):null;\n  if(!v){try{v=JSON.parse(localStorage.getItem('khach-cols-v2')||'null')}catch(e){}}\n  return Array.isArray(v)&&v.length===4&&v.every(n=>n>0)?v:COL_DEFAULT.slice()})();\nfunction applyCols(){\n  document.documentElement.style.setProperty('--cols',cols.map(n=>`minmax(0,${n}fr)`).join(' '));\n  try{localStorage.setItem('khach-cols-v2',JSON.stringify(cols))}catch(e){}\n  requestAnimationFrame(()=>{const w=[...document.querySelectorAll('.thead > div')].map(d=>Math.round(d.getBoundingClientRect().width)),t=cols.reduce((a,b)=>a+b,0);\n    $('#colOut').textContent=COL_NAMES.map((n,i)=>`${n}: ${cols[i]} (${Math.round(cols[i]/t*100)}% · ${w[i]}px)`).join('\\n');\n    document.querySelectorAll('.colcfg-px').forEach((el,i)=>el.textContent=w[i]+'px')});\n}\n$('#colInputs').innerHTML=COL_NAMES.map((n,i)=>`<label class=\"t-body-caption\">${n}<input type=\"number\" min=\"1\" step=\"1\" inputmode=\"numeric\" class=\"t-body-section\" data-i=\"${i}\" value=\"${cols[i]}\" aria-label=\"Tỷ lệ cột ${n}\"><span class=\"colcfg-px t-body-caption\"><\/span><\/label>`).join('');\n$('#colInputs').addEventListener('input',e=>{const i=+e.target.dataset.i,v=parseFloat(e.target.value);if(v>0){cols[i]=v;applyCols()}});\n$('#colReset').onclick=()=>{cols=COL_DEFAULT.slice();document.querySelectorAll('#colInputs input').forEach((el,i)=>el.value=cols[i]);applyCols()};\n$('#colCopy').onclick=async()=>{const u=new URL(location.href);u.searchParams.set('cols',cols.join(','));try{await navigator.clipboard.writeText(u.toString());toast('Đã copy link kèm tỷ lệ cột')}catch(e){toast('Thêm ?cols='+cols.join(',')+' vào cuối link')}};\n$('#colFab').onclick=()=>{const o=$('#colCfg').classList.toggle('is-open');$('#colFab').setAttribute('aria-expanded',o);if(o)$('#colInputs input').focus()};\n$('#colClose').onclick=()=>{$('#colCfg').classList.remove('is-open');$('#colFab').setAttribute('aria-expanded','false')};\nif(window.self!==window.top){$('#colFab').hidden=true;$('#colCfg').hidden=true} /* nhúng trong canvas: ẩn tool */\naddEventListener('resize',applyCols);\nrenderCfg();chipState();render();applyCols();\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script id="src-spec" type="application/json">"# Handoff Spec: CRM — Revamp Lead list (tab Khách)\n\n**Vertical:** GDS (Chợ Tốt)\n**Platform:** Desktop web\n**Source HTML:** `screens/khach-intent/index.html` · prototype online https://claude.ai/artifact/B5bD9R5cwXZEgJuHGpKY5z\n**So sánh Current / New:** https://claude.ai/artifact/7rFsiCDt32HSushktBGWai (`screens/khach-intent/canvas.html`)\n**Figma:** Platform Handoff • 2026, node `9854:112773` — reference only, PRD + design spec thắng khi lệch\n**PRD:** [PLMO-3296](https://701search.atlassian.net/browse/PLMO-3296) · task dev [PLMO-3308](https://701search.atlassian.net/browse/PLMO-3308)\n**Design Owner:** Lâm Phan\n**Date:** 2026-10-22\n**Generated by:** prototype-to-spec skill v1.0.0 · sourced from Phase-1 audit (88/100 — READY WITH NOTES)\n\n---\n\n## Open Items\n\n### 🟡 Non-blocking — build được nhưng cần confirm\n| # | Node | Câu hỏi | Owner |\n|---|------|---------|-------|\n| 1 | Dữ liệu cũ > 3 nhãn | Lead đã có hơn 3 nhãn từ trước (trước khi áp giới hạn 3): hiện cả, hay chỉ 3 nhãn đầu? Popover có bắt bỏ bớt trước khi Lưu? | PM |\n| 2 | Popover “Gắn phân loại” → nút Quản lý | Giữ đích đến hiện tại (trang quản lý phân loại)? Prototype chỉ báo “chưa thiết kế”. | PM |\n| 3 | Màn hẹp (< 1280px) | Cột 25% còn ≈ 250px: cụm nút cho “Hiện số” xuống dòng full width (đã làm trong prototype). Xác nhận đây là hành vi mong muốn. | Lâm Phan |\n\n---\n\n## Overview\nRevamp danh sách khách (Lead list) trong tab **Khách** của CRM trên Desktop. Mục tiêu: người bán nhìn nhanh được thông tin và phân loại của từng khách. Nhãn phân loại chuyển từ cột Ghi chú lên ngay dưới tên khách. Gắn nhãn thao tác trực tiếp trên nhãn, không cần mở menu ⋮.\n\n**Phạm vi thay đổi (theo AC PLMO-3296)**\n1. Avatar khách lớn hơn: 20 → 48.\n2. Nhãn phân loại hiển thị dưới tên khách, không còn ở cột Ghi chú.\n3. Hiện chip “+ Phân loại” khi khách có < 3 nhãn; tối đa 3 nhãn / khách.\n4. Bỏ mục gắn nhãn khỏi menu ⋮ (menu chỉ còn **Xoá**).\n5. Tỷ lệ cột 25% / 30% / 25% / 20% (Khách hàng / Nhu cầu / Tin khách quan tâm / Ghi chú).\n6. Mọi rule khác giữ nguyên (lọc, đánh dấu đã đọc, Hiện số, ghi chú, xoá khách…).\n\n---\n\n## Display Condition\n```\nAlways visible — no display conditions (thay đổi layout trên list có sẵn)\nChip “+ Phân loại”: SHOW khi số nhãn của khách < 3 · HIDE khi đủ 3\n```\n\n## Display Position\n| Platform | Vị trí |\n|----------|--------|\n| Desktop | CRM › tab **Khách** › danh sách khách (bảng 4 cột dưới header “Khách”). Không đổi vị trí màn. |\n\n---\n\n## Interaction Rules\n| Trigger | Hành vi |\n|---------|---------|\n| Click 1 nhãn bất kỳ trên card | Mở popover **Gắn phân loại** (component hiện có), neo ngay dưới nhãn vừa bấm |\n| Click chip “+ Phân loại” | Mở popover **Gắn phân loại**, neo dưới chip |\n| Popover: tick / bỏ tick 1 phân loại | Chỉ đổi lựa chọn tạm (draft); chưa áp vào card |\n| Popover: đã chọn đủ 3 | Các phân loại chưa chọn chuyển **disabled**, không tick được |\n| Popover: Lưu | Áp lựa chọn vào khách, đóng popover, card cập nhật dòng nhãn |\n| Popover: Esc / click ra ngoài | Đóng, huỷ draft |\n| Click ⋮ trên card | Menu chỉ có **Xoá** → mở Drawer xác nhận xoá (giữ nguyên rule hiện tại) |\n| Click vùng trống của card | Giữ nguyên rule hiện tại (đánh dấu đã đọc) |\n\n> Click nhãn / chip / ⋮ **không** tính là click card (không trigger đánh dấu đã đọc qua vùng card — giữ như hành vi các nút trong card hiện nay).\n\n---\n\n## Common Rules\n```yaml\ncommon-rules:\n  loading: DS platform default        # decided by design owner\n  label-limit: 3                      # tối đa 3 nhãn / khách\n  label-overflow: wrap                # nhãn tràn → xuống dòng, không crop, không scroll\n  label-color: theo màu của phân loại (do người bán đặt ở Quản lý phân loại) — giữ nguyên dữ liệu hiện có\n  column-ratio: 25 / 30 / 25 / 20     # áp cho header bảng VÀ từng hàng\n```\n\n---\n\n## Screen CRM-LEAD-LIST — Danh sách khách\n\n```yaml\nmode: partial\nscreen: crm-lead-list-gds\nplatform: desktop\nsize: responsive (thiết kế ở 1512 × 812; list rộng = viewport − side rail 100 − padding 8×2)\ndirection: column\nbackground: background-app (#f7f7f7)\nreplaces: lead-table (header 4 cột + lead row)\n# Chỉ spec phần thay đổi: header bảng + lead row. Navbar, side rail, title \"Khách\", hàng filter giữ nguyên.\n\nchildren:\n  - id: table-header\n    type: grid\n    columns: \"minmax(0,25fr) minmax(0,30fr) minmax(0,25fr) minmax(0,20fr)\"   # source: .grid\n    width: fill\n    height: wrap-content\n    children:\n      - id: col-head          # ×4: Khách hàng · Nhu cầu · Tin khách quan tâm · Ghi chú\n        padding: { y: padding-medium-16, x: padding-medium-16 }\n        text: { typo: header-caption, color: text-primary (#222222), align: center }\n        border-right: 1px border-divider (#f4f4f4)   # cột cuối không có\n        width: fill\n        height: wrap-content\n\n  - id: lead-row              # source: article.row\n    type: grid\n    columns: \"minmax(0,25fr) minmax(0,30fr) minmax(0,25fr) minmax(0,20fr)\"\n    background: background-primary (#ffffff)        # chưa đọc: background-brand-light (#fff8d6) — giữ rule cũ\n    radius: radius-decoration (16)\n    gap-between-rows: gap-x-small-8 (8)\n    width: fill\n    height: wrap-content (= cột cao nhất)\n    children:\n\n      # ───── Cột 1 · Khách hàng (25%) — THAY ĐỔI CHÍNH ─────\n      - id: col-customer      # source: .col-cust\n        type: column\n        padding: { y: padding-small-12, x: padding-small-12 }\n        gap: gap-small-12 (12)          # giữa 3 cụm\n        border-right: 1px border-divider (#f4f4f4)\n        width: fill\n        height: fill\n        children:\n          - id: group-identity           # cụm 1\n            type: row\n            align: top                   # avatar + ⋮ bám top khi nhãn xuống dòng\n            gap: gap-2x-small-6 (6)\n            width: fill\n            height: wrap-content\n            children:\n              - component: Avatar\n                variant: Person\n                size: 48px                 # trước: 20px\n                width: 48\n                height: 48\n                # source: .ava\n              - id: identity-text\n                type: column\n                gap: gap-2x-small-6 (6)\n                width: fill\n                height: wrap-content\n                children:\n                  - id: lead-name\n                    text: { typo: header-caption, color: text-primary (#222222), max-lines: 1, overflow: ellipsis }\n                    width: fill\n                    height: 20\n                  - id: label-row        # MỚI — xem §Labelling\n                    type: row\n                    wrap: true\n                    gap: { x: gap-x-small-8 (8), y: gap-2x-small-6 (6) }\n                    width: fill\n                    height: wrap-content\n                    children:\n                      - component: Labelling        # ×0..3\n                        props: { label: \"<tên phân loại>\", icon: tag-fill, icon-color: \"<màu phân loại>\" }\n                        on-tap: open-popover → Gắn phân loại\n                      - component: Labelling        # chip “+ Phân loại”\n                        props: { label: \"Phân loại\", icon: Plus-outline, icon-color: icon-primary (#222222) }\n                        visible-if: labels.count < 3\n                        on-tap: open-popover → Gắn phân loại\n              - component: Icon Button\n                variant: ghost\n                size: 20\n                props: { icon: Morevertical-outline, icon-color: icon-secondary (#595959), aria-label: \"Thêm tuỳ chọn\" }\n                width: 20\n                height: 20\n                on-tap: open-menu → [Xoá]\n                # source: .more-btn\n\n          - id: group-meta               # cụm 2\n            type: column\n            gap: gap-2x-small-6 (6)\n            width: fill\n            height: wrap-content\n            children:\n              - id: rating-row\n                type: row\n                gap: gap-x-small-8 (8)\n                children: [ \"Star-fill 20 icon-brand (#ffba00) + '4.5' (gap 4)\", \"divider 1×20 border-thin (#e8e8e8)\", \"'12 đánh giá'\" ]\n                text: { typo: body-section, color: text-secondary (#595959) }\n                width: fill\n                height: 20\n              - id: joined-row\n                type: row\n                gap: gap-2x-small-4 (4)\n                children: [ \"Clock-outline 20 icon-tertiary (#8c8c8c)\", \"'Đã tham gia:'\", \"'3 năm trước'\" ]\n                text: { typo: body-section, color: text-secondary (#595959) }\n                width: fill\n                height: 20\n\n          - id: group-actions            # cụm 3 — giữ nguyên nút, chỉ đổi khoảng cách\n            type: row\n            wrap: true                     # cột hẹp: “Hiện số” xuống dòng, full width\n            gap: gap-2x-small-6 (6)\n            width: fill\n            height: wrap-content\n            children:\n              - component: Button\n                variant: tertiary\n                size: M - 32px\n                state: active\n                props: { label: \"Nhắn tin\", icon: Chat-outline, icon-position: left, isPill: true }\n                tokens: { bg: button-blank (#ffffff), border: border-regular (#dddddd) }\n                padding: { x: padding-medium-16 }\n                width: auto\n                height: 32\n              - component: Button\n                variant: primary\n                size: M - 32px\n                state: active\n                props: { label: \"098765**** Hiện số\", isPill: true }\n                tokens: { bg: button-primary (#ffd400), text: text-on-background (#222222) }\n                visible-if: lead.phone != null        # rule cũ\n                width: fill (flex 1)\n                height: 32\n\n      # ───── Cột 2 · Nhu cầu (30%) — chỉ đổi độ rộng ─────\n      - id: col-need\n        type: column\n        padding: { y: padding-small-12, x: padding-small-12 }\n        gap: gap-2x-small-6 (6)\n        width: fill\n        height: fill\n        # Nội dung, badge “Mới”, giờ — giữ nguyên\n\n      # ───── Cột 3 · Tin khách quan tâm (25%) — chỉ đổi độ rộng ─────\n      - id: col-posts\n        type: column\n        padding: { y: padding-small-12, x: padding-small-12 }\n        gap: gap-x-small-8 (8)\n        width: fill\n        height: fill\n        # Thumbnail + tên tin (1 dòng, ellipsis) + giá — giữ nguyên\n\n      # ───── Cột 4 · Ghi chú (20%) — BỎ dòng nhãn ─────\n      - id: col-note\n        type: column\n        padding: { y: padding-small-12, x: padding-small-12 }\n        gap: gap-x-small-8 (8)\n        width: fill\n        height: fill\n        children:\n          - id: note                       # “Nhấn để thêm ghi chú” / nội dung ghi chú — giữ nguyên\n        # KHÔNG còn label-row ở cột này\n```\n\n### Labelling (nhãn phân loại & chip “+ Phân loại”)\n```yaml\ncomponent: Labelling           # source: .label · .tag-add\nheight: 20\npadding: { y: padding-min-2 (2), x: padding-2x-small-4 (4) }\ngap: gap-2x-small-4 (4)        # icon ↔ chữ\nbackground: background-tertiary (#e8e8e8)\nradius: radius-pill (999)\nicon: { name: tag-fill, size: 12, color: \"<màu phân loại>\" }      # chip: Plus-outline 12, icon-primary (#222222)\ntext: { typo: label-annotation (10/16 Bold 700), color: text-primary (#222222), white-space: nowrap }\nstates:\n  hover:   background interaction-neutral-light-hover (#e8e8e8)\n  pressed: background interaction-neutral-light-pressed (#dddddd)\n  active (popover đang mở từ nhãn này): như hover\n```\n\n### Popover “Gắn phân loại” (component hiện có — chỉ ghi phần mới)\n```yaml\nmở-từ: click Labelling bất kỳ · click chip “+ Phân loại”   # KHÔNG còn mở từ menu ⋮\nvị-trí: dưới anchor 8px, canh trái anchor; thiếu chỗ dưới → lật lên trên anchor\ngiới-hạn: chọn tối đa 3\n  hint: \"Chọn tối đa 3 phân loại (n/3)\" — body-caption, text-secondary (#595959)\n  đủ 3: item chưa chọn disabled — text text-disabled (#c0c0c0), checkbox border-disabled (#c0c0c0), icon mờ\náp-dụng: chỉ khi bấm Lưu; Esc / click ngoài = huỷ\ngiữ-nguyên: danh sách phân loại, checkbox DS 24, nút Quản lý (Tertiary L-40) · Lưu (Primary L-40)\n```\n\n### Menu ⋮\n```yaml\nitems: [ Xoá ]        # bỏ mục gắn nhãn (Phân loại khách)\nXoá: Trashbin-outline 24 + body-page → Drawer xác nhận (Huỷ / Xoá khách) — giữ nguyên\n```\n\n---\n\n## DS Components Used\n| # | Component | Variant | DS Token Dependencies | Notes |\n|---|-----------|---------|----------------------|-------|\n| 1 | Avatar | Person · 48px | — | Trước 20px |\n| 2 | Labelling | label · add-chip | background-tertiary, text-primary, icon-primary | DS chưa có component này trong 22 DS component — đang dùng bản của sản phẩm |\n| 3 | Icon Button | ghost · 20 | icon-secondary | Nút ⋮ |\n| 4 | Button | Tertiary M-32 pill | button-blank, border-regular | Nhắn tin — không đổi |\n| 5 | Button | Primary M-32 pill | button-primary, text-on-background | Hiện số — không đổi |\n| 6 | Checkbox | 24 | background-brand, border-regular, border-disabled | Trong popover — thêm state disabled khi đủ 3 |\n| 7 | Drawer | Desktop | radius-modal | Xác nhận xoá — không đổi |\n\n---\n\n## Design Tokens Map\n\n### Backgrounds\n| Element | Token | GDS Value |\n|---|---|---|\n| Lead row | background-primary | #ffffff |\n| Lead row chưa đọc | background-brand-light | #fff8d6 |\n| Labelling | background-tertiary | #e8e8e8 |\n| Labelling hover / pressed | interaction-neutral-light-hover / -pressed | #e8e8e8 / #dddddd |\n\n### Text\n| Element | Token | Typography Class | Size/Weight/LH |\n|---|---|---|---|\n| Header cột | text-primary | header-caption | 14 / 600 / 20 |\n| Tên khách | text-primary | header-caption | 14 / 600 / 20 |\n| Nhãn, chip | text-primary | label-annotation | 10 / 700 / 16 |\n| Đánh giá, năm tham gia | text-secondary | body-section | 14 / 400 / 20 |\n| Hint popover | text-secondary | body-caption | 12 / 400 / 18 |\n| Item popover disabled | text-disabled | body-page | 16 / 400 / 24 |\n\n### Icons\n| Element | Icon Name (DS) | Style | Token |\n|---|---|---|---|\n| Nhãn | tag-fill | fill · 12 | màu của phân loại |\n| Chip “+ Phân loại” | Plus-outline | outline · 12 | icon-primary (#222222) |\n| ⋮ | Morevertical-outline | outline · 20 | icon-secondary (#595959) |\n| Sao đánh giá | Star-fill | fill · 20 | icon-brand (#ffba00) |\n| Đã tham gia | Clock-outline | outline · 20 | icon-tertiary (#8c8c8c) |\n\n### Borders & Dividers\n| Element | Token | Value |\n|---|---|---|\n| Ngăn cột | border-divider | #f4f4f4 |\n| Vạch ngăn đánh giá | border-thin | #e8e8e8 |\n\n### Spacing\n| Chỗ | Token | px |\n|---|---|---|\n| Padding cột | padding-small-12 | 12 |\n| Giữa 3 cụm cột Khách hàng | gap-small-12 | 12 |\n| Trong cụm (avatar↔tên, tên↔nhãn, 2 dòng meta, 2 nút) | gap-2x-small-6 | 6 |\n| Giữa 2 nhãn (ngang) | gap-x-small-8 | 8 |\n| Giữa 2 dòng nhãn (dọc) | gap-2x-small-6 | 6 |\n\n---\n\n## Interaction States\n| Element | State | Visual Change | Token(s) |\n|---|---|---|---|\n| Labelling / chip | Default · Hover · Pressed | Nền đổi | background-tertiary → interaction-neutral-light-hover → interaction-neutral-light-pressed |\n| Labelling / chip | Active (popover mở) | Như Hover | interaction-neutral-light-hover |\n| Item popover | Disabled (đã đủ 3) | Chữ + checkbox xám, không click | text-disabled, border-disabled |\n| ⋮ | Hover | Nền tròn | interaction-neutral-light-hover |\n| Các nút khác | — | Giữ nguyên | — |\n\n---\n\n## Content Rules\n| Element | Rule |\n|---|---|\n| Tên khách | 1 dòng, ellipsis |\n| Dòng nhãn | 0–3 nhãn + chip “+ Phân loại” (khi < 3); tràn → xuống dòng; tên nhãn không cắt (nowrap trong 1 nhãn) |\n| Thứ tự nhãn | Giữ thứ tự hiện có của dữ liệu; chip luôn đứng cuối |\n| Cột Ghi chú | Chỉ nội dung ghi chú / “Nhấn để thêm ghi chú”; không hiện nhãn |\n| Cụm nút | Không đủ chỗ 2 nút trên 1 dòng → “Hiện số” xuống dòng, full width |\n\n---\n\n## Edge Cases & Issues\n### Resolved\n| Case | Behaviour | Source |\n|---|---|---|\n| Khách chưa có nhãn | Dòng nhãn chỉ có chip “+ Phân loại” | AC + prototype |\n| Khách có 1–2 nhãn | Nhãn + chip “+ Phân loại” ở cuối | AC |\n| Khách có 3 nhãn | Chỉ 3 nhãn, không có chip | AC |\n| Nhãn tràn chiều ngang | Xuống dòng; avatar và ⋮ bám top | confirmed by designer |\n| Bỏ hết nhãn rồi Lưu | Card về trạng thái chỉ có chip “+ Phân loại” | prototype |\n| Khách không có SĐT | Không có nút Hiện số (rule cũ) | unchanged |\n| Loading | DS platform default | decided by design owner |\n\n### Issues\nXem Open Items #1–3 (non-blocking).\n\n---\n\n## Prototype-suggested (ngoài AC — cần xác nhận, KHÔNG build theo ticket này)\n| Element | Mô tả | Giữ? |\n|---|---|---|\n| Chip lọc “Nổi bật ▾” (sau “Chưa đọc”) | Lựa chọn trong prototype là đề xuất: Đã lấy SĐT · Liên hệ nhiều người bán · Quay lại xem tin · Mới trong 24 giờ | ⬜ confirm |\n| Lớp blur dưới navbar | Che khe 8px giữa navbar và header khi cuộn list (background-app 88% + blur 16px) | ⬜ confirm |\n| Thanh bên mục “Ứng viên” | Có trong Figma, UI đang chạy chưa có | ⬜ confirm |\n| Avatar chữ viết tắt | Prototype không tải được ảnh — production dùng ảnh avatar thật | ⬜ n/a |\n\n---\n\n## Tagging & Analytics\nNo new events — reuses existing tracking. Nếu cần đo việc gắn nhãn từ vị trí mới (click nhãn / chip thay cho menu ⋮), PM bổ sung event riêng.\n\n---\n\n## Prototype Quality\n**Summary:** 3 ghi chú — annotation coverage thấp (ít `data-ds-*`), dữ liệu mẫu tự đặt, công cụ prototype nằm trong file.\n| Selector / Node | Vấn đề | → Sửa |\n|---|---|---|\n| Toàn file | Chưa nhúng `data-ds-*` đầy đủ (spec suy từ CSS var) | Lần sau bật spec-ready khi gen prototype |\n| `#colFab`, `#cfgFab` | Công cụ chỉnh tỷ lệ cột / vị trí nhãn — không thuộc màn | Bỏ qua khi build |\n| Danh sách phân loại, màu nhãn | Dữ liệu demo | Dùng dữ liệu thật của người bán |\n\n---\n\n## Animations & Transitions\nKhông có animation mới. Popover, menu ⋮, Drawer xoá giữ animation hiện có.\n\n---\n\n## Accessibility\n| Requirement | Details |\n|---|---|\n| Focus order | Tên → từng nhãn → chip “+ Phân loại” → ⋮ → Nhắn tin → Hiện số |\n| ARIA labels | Nhãn: “<tên> — sửa phân loại”; chip: “Thêm phân loại”; ⋮: “Thêm tuỳ chọn”; popover `role=dialog`, item `role=checkbox` + `aria-disabled` khi đủ 3 |\n| Touch / click target | Nhãn cao 20 (desktop, chuột) — chấp nhận; giữ vùng click không chồng lên nhau |\n| Keyboard | Enter/Space mở popover; Esc đóng popover / menu / drawer |\n\n---\n\n## Known DS Gotchas (GDS)\n- [ ] Header weight = 600 (tên khách, header cột) · Label = 700 (nhãn 10px) · Body = 400\n- [ ] text-on-background GDS = #222222 (nút Hiện số)\n- [ ] Token format `token-name (#hex)` — name là contract\n- [ ] Tỷ lệ cột áp cho **cả header lẫn hàng**, dùng `minmax(0, Nfr)` để cột co được, không tràn\n- [ ] Nhãn không còn render ở cột Ghi chú\n\n---\n\n## Verify Checklist\n```yaml\nverify-checklist:\n  layout:\n    - \"Ở 1512px: cột ≈ 349 / 419 / 349 / 279 px; header và hàng thẳng cột\"\n    - \"Cột Khách hàng: 3 cụm cách 12px; trong cụm 6px\"\n    - \"Avatar 48×48\"\n  labels:\n    - \"Nhãn nằm dưới tên, không còn ở cột Ghi chú\"\n    - \"0 nhãn → chỉ chip; 1–2 nhãn → nhãn + chip; 3 nhãn → không chip\"\n    - \"Nhãn tràn → xuống dòng, cách 6px; avatar + ⋮ bám top\"\n    - \"Labelling: cao 20, padding 2/4, background-tertiary, label-annotation 10/16 Bold, icon 12\"\n  interactions:\n    - \"Click nhãn hoặc chip → popover Gắn phân loại neo dưới anchor\"\n    - \"Popover: đủ 3 → item chưa chọn disabled; Lưu mới áp dụng; Esc/click ngoài huỷ\"\n    - \"Menu ⋮ chỉ có Xoá → Drawer xác nhận\"\n  unchanged:\n    - \"Lọc, chưa đọc, Hiện số, Nhắn tin, ghi chú, xoá khách hoạt động như cũ\"\n  checkpoints-non-blocking:\n    - { node: \"Dữ liệu cũ > 3 nhãn\", question: \"Hiện cả hay 3 nhãn đầu?\", owner: PM, status: \"assumption — hiện cả, popover không cho thêm; confirm before QC\" }\n    - { node: \"Nút Quản lý\", question: \"Giữ đích đến hiện tại?\", owner: PM, status: \"assumption — giữ nguyên\" }\n    - { node: \"Màn < 1280px\", question: \"Hiện số xuống dòng full width\", owner: \"Lâm Phan\", status: \"assumption — như prototype\" }\n```\n"</script>

  CHANGES.forEach(c => c.m = []); /* không khoanh — chỉ ghi chú */
  function click(d, sel) { const el = d.querySelector(sel); el && el.click(); }

  /* build frame DOM */
  FRAMES.forEach(f => {
    const el = document.createElement('div'); el.className = 'frame board'; el.id = 'f-' + f.id;
    const lbl = `<div class="frame-label"><b>${f.title}</b><span>${f.note}</span></div>`;
    el.innerHTML = lbl + (f.kind === 'img'
      ? `<canvas class="shot" width="2000" height="1074" style="width:${f.w}px;height:${f.h}px" role="img" aria-label="Ảnh chụp UI hiện tại màn Khách"></canvas>`
      : `<iframe title="Bản mới: ${f.title}" width="${f.w}" height="${f.h || 900}" tabindex="-1"></iframe>`);
    world.appendChild(el); f.el = el; f.ifr = el.querySelector('iframe');
  });
  /* vẽ ảnh Current lên <canvas> từ dữ liệu nhúng (không cần tải ảnh qua mạng) */
  (function drawShot() {
    const cv = world.querySelector('canvas.shot'); if (!cv) return;
    const bin = atob(SRC.old), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const blob = new Blob([u8], { type: 'image/jpeg' }), ctx = cv.getContext('2d');
    const done = img => ctx.drawImage(img, 0, 0, cv.width, cv.height);
    if (window.createImageBitmap) createImageBitmap(blob).then(done).catch(viaImg); else viaImg();
    function viaImg() { const im = new Image(); im.onload = () => done(im); im.src = URL.createObjectURL(blob); }
  })();
  function layout() {
    const GAPY = 200;
    let y = 0;
    for (let r = 0; r < 3; r++) {
      const fs = FRAMES.filter(f => f.row === r);
      fs.forEach(f => { f.x = COLX[f.v]; f.y = y; f.el.style.left = f.x + 'px'; f.el.style.top = y + 'px'; });
      y += Math.max(...fs.map(f => f.hh || f.h || 900)) + GAPY;
    }
    const bd = document.querySelector('.panel'); if (bd) { bd.style.left = (COLX.new + 1512 + 120) / 1.5 + 'px'; bd.style.top = '0px'; }
    drawMarks();
  }
  /* load iframes */
  const iframes = FRAMES.filter(f => f.ifr);
  let loaded = 0;
  iframes.forEach(f => {
    f.ifr.addEventListener('load', () => {
      const d = f.ifr.contentDocument;
      const size = () => {
        if (!f.h) { const h = Math.max(900, d.documentElement.scrollHeight); if (h !== f.hh) { f.hh = h; f.ifr.height = h; } }
        else f.hh = f.h;
        layout();
      };
      setTimeout(() => { f.setup && f.setup(d); }, 300);
      (d.fonts ? d.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { size(); if (++loaded === iframes.length) fit(); }, 600));
    });
    f.ifr.srcdoc = SRC[f.v];
  });

  /* ---------- Marks ---------- */
  let active = -1;
  const markLayer = document.createElement('div'); world.appendChild(markLayer);
  setTimeout(layout, 0);
  function rectOf(fid, sel) {
    const f = FRAMES.find(x => x.id === fid); if (!f || f.x == null) return null;
    if (typeof sel === 'object') return { x: f.x + sel.x, y: f.y + sel.y, w: sel.w, h: sel.h, v: f.v };
    let el; try { el = f.ifr.contentDocument.querySelector(sel); } catch (e) { return null; }
    if (!el) return null; const r = el.getBoundingClientRect(); if (!r.width && !r.height) return null;
    return { x: f.x + r.left, y: f.y + r.top, w: r.width, h: r.height, v: f.v };
  }
  function drawMarks() {
    markLayer.innerHTML = '';
    CHANGES.forEach((c, i) => c.m.forEach(([fid, sel]) => {
      const r = rectOf(fid, sel); if (!r) return;
      const m = document.createElement('div'); m.className = 'mark ' + r.v + (i === active ? ' on' : '');
      m.style.cssText = `left:${r.x - 4}px;top:${r.y - 4}px;width:${r.w + 8}px;height:${r.h + 8}px`;
      m.innerHTML = `<div class="box"></div><button class="pin" aria-label="Thay đổi ${i + 1}">${i + 1}</button>`;
      m.querySelector('.pin').addEventListener('click', e => { e.stopPropagation(); select(i); });
      markLayer.appendChild(m);
    }));
    scalePins();
  }

  /* ---------- Panel ---------- */
  const board = document.querySelector('.panel'); world.appendChild(board);
  const list = document.getElementById('list');
  list.innerHTML = CHANGES.map((c, i) => `<button class="item" data-i="${i}"><span class="n">${i + 1}</span><span><h3>${c.t}${c.flag ? `<span class="flag">${c.flag}</span>` : ''}</h3><dl class="diff"><dt class="o">Current</dt><dd class="o">${c.o}</dd></dl><dl class="spec">${c.s.map(([k, v]) => `<dt>${k}</dt><dd>${C(v)}</dd>`).join('')}</dl></span></button>`).join('');
  list.addEventListener('click', e => { const b = e.target.closest('.item'); b && select(+b.dataset.i); });
  document.getElementById('count').textContent = CHANGES.length + ' thay đổi';
  
  function select(i) {
    active = i; drawMarks();
    list.querySelectorAll('.item').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
    list.querySelector(`.item[data-i="${i}"]`).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const rs = CHANGES[i].m.map(([f, s]) => rectOf(f, s)).filter(Boolean); if (!rs.length) return;
    const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y)), x1 = Math.max(...rs.map(r => r.x + r.w)), y1 = Math.max(...rs.map(r => r.y + r.h));
    fitBox(x0, y0, x1 - x0, y1 - y0, 160, 1.2);
  }
  
  

  /* ---------- Camera ---------- */
  const cam = { x: 40, y: 200, z: .3 }, MIN = .05, MAX = 3;
  const zoomBtn = document.getElementById('tZoom');
  function apply() {
    world.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
    const g = 24 * cam.z; vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
    zoomBtn.textContent = Math.round(cam.z * 100) + '%';
    document.querySelectorAll('.frame-label').forEach(l => l.style.transform = `scale(${Math.min(4, 1 / cam.z)})`);
    document.querySelectorAll('.col-title').forEach(l => l.style.transform = `scale(${Math.min(3, Math.max(1, .6 / cam.z))})`);
    scalePins();
  }
  function scalePins() { const s = Math.min(6, 1 / cam.z); document.querySelectorAll('.pin').forEach(p => p.style.transform = `scale(${s})`); }
  function zoomAt(z, cx, cy) { z = Math.min(MAX, Math.max(MIN, z)); cam.x = cx - (cx - cam.x) * (z / cam.z); cam.y = cy - (cy - cam.y) * (z / cam.z); cam.z = z; apply(); }
  let anim;
  function animateTo(t) {
    cancelAnimationFrame(anim); const s = { ...cam }, t0 = performance.now(), D = 380;
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
      cam.x = s.x + (t.x - s.x) * e; cam.y = s.y + (t.y - s.y) * e; cam.z = s.z + (t.z - s.z) * e; apply(); if (k < 1) anim = requestAnimationFrame(step); };
    anim = requestAnimationFrame(step);
  }
  function fitBox(x, y, w, h, pad, maxZ) {
    const W = vp.clientWidth, H = vp.clientHeight - 80;
    const z = Math.min(maxZ || MAX, (W - pad * 2 / 4) / (w + pad), (H) / (h + pad));
    animateTo({ z, x: (W - w * z) / 2 - x * z, y: (H - h * z) / 2 - y * z + 10 });
  }
  function fit() {
    const xs = FRAMES.map(f => f.x), ys = FRAMES.map(f => f.y);
    const top2 = FRAMES.filter(f => f.row < 2); const x1 = Math.max(...FRAMES.map(f => f.x + f.w)), y1 = Math.max(...top2.map(f => f.y + (f.hh || f.h || 900)));
    const bd = document.querySelector('.panel'), bx1 = bd ? COLX.new + 1512 + 120 + bd.offsetWidth * 1.5 : x1, by1 = bd ? bd.offsetHeight * 1.5 : y1;
    fitBox(Math.min(...xs), Math.min(...ys) - 120, Math.max(x1, bx1) - Math.min(...xs), Math.max(y1, by1) - Math.min(...ys) + 120, 120);
  }
  /* ---------- Tỷ lệ cột cho artboard New ---------- */
  const COL_NAMES = ['Khách hàng', 'Nhu cầu', 'Tin quan tâm', 'Ghi chú'], COL_DEF = [25, 30, 25, 20];
  let cols = (() => { const q = new URLSearchParams(location.search).get('cols'); let v = q ? q.split(',').map(Number) : null;
    if (!v) { try { v = JSON.parse(localStorage.getItem('canvas-khach-cols-v2') || 'null'); } catch (e) {} }
    return Array.isArray(v) && v.length === 4 && v.every(n => n > 0) ? v : COL_DEF.slice(); })();
  const colInputs = document.getElementById('colInputs');
  colInputs.innerHTML = COL_NAMES.map((n, i) => `<label>${n}<input type="number" min="1" step="1" inputmode="numeric" data-i="${i}" value="${cols[i]}" aria-label="Tỷ lệ cột ${n}"><span class="px" data-px="${i}">–</span></label>`).join('');
  function applyCols() {
    try { localStorage.setItem('canvas-khach-cols-v2', JSON.stringify(cols)); } catch (e) {}
    FRAMES.filter(f => f.v === 'new' && f.ifr).forEach(f => {
      try {
        const d = f.ifr.contentDocument; if (!d || !d.documentElement) return;
        d.documentElement.style.setProperty('--cols', cols.map(n => `minmax(0,${n}fr)`).join(' '));
        const w = [...d.querySelectorAll('.thead > div')].map(x => Math.round(x.getBoundingClientRect().width));
        colInputs.querySelectorAll('[data-px]').forEach((el, i) => el.textContent = (w[i] || '–') + 'px');
      } catch (e) {}
    });
  }
  colInputs.addEventListener('input', e => { const i = +e.target.dataset.i, v = parseFloat(e.target.value); if (v > 0) { cols[i] = v; applyCols(); } });
  document.getElementById('colReset').onclick = () => { cols = COL_DEF.slice(); colInputs.querySelectorAll('input').forEach((el, i) => el.value = cols[i]); applyCols(); };
  FRAMES.filter(f => f.v === 'new' && f.ifr).forEach(f => f.ifr.addEventListener('load', () => { applyCols(); setTimeout(applyCols, 700); setTimeout(applyCols, 1500); }));

  apply();
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { const r = vp.getBoundingClientRect(); zoomAt(cam.z * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top); }
    else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); }
  }, { passive: false });
  let pan = false, drag = null;
  function setPan(on) { pan = on; vp.classList.toggle('panning', on); }
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); setPan(true); }
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') setPan(false); });
  vp.addEventListener('pointerdown', e => {
    if (!(pan || e.button === 1 || e.target === vp || e.target === world)) return;
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; vp.classList.add('panning', 'dragging'); vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => { if (!drag) return; cam.x = drag.cx + e.clientX - drag.x; cam.y = drag.cy + e.clientY - drag.y; apply(); });
  vp.addEventListener('pointerup', () => { drag = null; vp.classList.remove('dragging'); if (!pan) vp.classList.remove('panning'); });
  const c = () => ({ x: vp.clientWidth / 2, y: vp.clientHeight / 2 });
  document.getElementById('tIn').onclick = () => zoomAt(cam.z * 1.25, c().x, c().y);
  document.getElementById('tOut').onclick = () => zoomAt(cam.z / 1.25, c().x, c().y);
  zoomBtn.onclick = () => zoomAt(1, c().x, c().y);
  document.getElementById('tFit').onclick = fit;
  /* Tải spec: trong claude.ai dùng capability `downloads`; mở file local thì tải trực tiếp */
  const SPEC_NAME = 'designspec-crm-lead-list-revamp.md';
  const specBtn = document.getElementById('tSpec');
  const dlP = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  specBtn.onclick = async () => {
    const md = JSON.parse(document.getElementById('src-spec').textContent);
    const downloads = await dlP;
    if (downloads) {
      try { await downloads.save({ filename: SPEC_NAME, data: md }); }
      catch (e) { if (e && (e.code === 'unavailable' || e.code === 'not_granted')) specBtn.hidden = true; }
      return;
    }
    if (window.claude) { specBtn.hidden = true; return; }   /* trong viewer nhưng không có quyền tải */
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown;charset=utf-8' }));
    a.download = SPEC_NAME; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  window.addEventListener('resize', fit);
})();
