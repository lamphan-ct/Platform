* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 40px 0;
  background: var(--background-app); font-family: 'Reddit Sans', sans-serif; color: var(--text-primary);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--border-info); outline-offset: 2px; }
.ds-icon { width: 24px; height: 24px; flex: none; color: var(--icon-primary); vertical-align: middle; }
.ds-icon--20 { width: 20px; height: 20px; } .ds-icon--16 { width: 16px; height: 16px; }

/* ---------- iPhone 14 Pro frame ---------- */
.iphone { /* ds-raw: khung máy, không thuộc DS */
  position: relative; width: 393px; height: 806px; flex-shrink: 0; background: #1c1c1e; border-radius: 56px; padding: 9px;
  box-shadow: 0 0 0 2px #3a3a3c, 0 24px 60px rgba(0,0,0,.35);
}
.iphone-screen { /* ds-raw: khung máy */
  position: relative; width: 375px; height: 788px; border-radius: 47px; overflow: hidden; background: var(--background-primary);
}
.dynamic-island { /* ds-raw: khung máy */
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 9999;
}
.app-scroll {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  scrollbar-width: none; background: var(--background-primary);
}
.app-scroll::-webkit-scrollbar { display: none; }
.app-scroll > * { flex-shrink: 0; }

/* Embedded on canvas: transparent page, keeps the 40px breathing room */
html.embed body { background: transparent; }
/* Artboard: plain 375 × viewport screen, no bezel */
html.artboard body { padding: 0; background: var(--background-primary); }
html.artboard .iphone { width: 375px; height: 100vh; padding: 0; border-radius: 0; box-shadow: none; background: none; }
html.artboard .iphone-screen { height: 100vh; border-radius: 0; }
html.artboard .dynamic-island { display: none; }
html.artboard .app-scroll { scroll-behavior: auto; }
html.mark #viewed:not(.collapsed) { outline: 2px dashed var(--border-info); outline-offset: -2px; }
html.mark #viewed:not(.collapsed)::before {
  content: "MỚI"; position: absolute; right: var(--padding-x-small-8); top: var(--padding-x-small-8); z-index: 2;
  padding: 0 var(--padding-2x-small-6); border-radius: var(--radius-ad-small); background: var(--background-info); color: var(--text-blank);
  font: 700 10px/16px 'Reddit Sans', sans-serif;
}

/* ---------- Top bar (status bar + search) ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--background-brand); transition: background .2s ease; }
.ios-statusbar { /* ds-raw: status bar iOS thuộc khung máy */
  height: 50px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 7px 32px;
  color: var(--text-primary); font-size: 14px; font-weight: 600;
}
.ios-statusbar .icons { display: flex; gap: 5px; align-items: center; }
.searchrow { height: 56px; display: flex; align-items: center; gap: var(--gap-2x-small-4); padding: 0 var(--padding-x-small-8); }
.icon-btn {
  position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border-radius: var(--radius-pill); transition: background .15s ease;
}
.icon-btn:hover { background: var(--interaction-brand-light-hover); }
.icon-btn:active { background: var(--interaction-brand-pressed); }
.search {
  flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: var(--gap-x-small-8);
  padding: 0 var(--padding-small-12); border-radius: var(--radius-pill); background: var(--background-primary);
  color: var(--text-tertiary); text-align: left; transition: background .2s ease;
}
.search .ds-icon { color: var(--icon-primary); }
.badge {
  position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; padding: 0 var(--padding-2x-small-4);
  border-radius: var(--radius-pill); background: var(--background-error); color: var(--text-blank);
  display: grid; place-items: center; box-shadow: 0 0 0 2px var(--background-brand);
}
.topbar.scrolled { background: var(--background-primary); box-shadow: 0 1px 0 var(--border-thin); }
.topbar.scrolled .search { background: var(--background-secondary); }
.topbar.scrolled .badge { box-shadow: 0 0 0 2px var(--background-primary); }
.topbar.scrolled .icon-btn:hover { background: var(--interaction-neutral-light-hover); }

.chips { display: flex; gap: var(--gap-x-small-8); padding: var(--padding-2x-small-4) var(--padding-medium-16) var(--padding-medium-16); overflow-x: auto; scrollbar-width: none; background: var(--background-brand); }
.chips::-webkit-scrollbar { display: none; }
.hchip {
  height: 32px; flex: none; display: inline-flex; align-items: center; gap: var(--gap-2x-small-4);
  padding: 0 var(--padding-x-small-8) 0 var(--padding-x-small-8); border-radius: var(--radius-pill); background: var(--background-primary);
}
.hchip .ds-icon { color: var(--icon-tertiary); }
.hchip .count { padding: 0 var(--padding-2x-small-6); border-radius: var(--radius-pill); background: var(--background-warning); color: var(--text-blank); }

/* ---------- Sheet ---------- */
.sheet { position: relative; margin-top: -12px; border-radius: var(--radius-modal) var(--radius-modal) 0 0; background: var(--background-primary); padding-top: var(--padding-medium-16); }
.cats { display: flex; gap: var(--gap-x-small-8); padding: 0 var(--padding-small-12); overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--gap-2x-small-4); text-align: center; color: var(--text-secondary); border-radius: var(--radius-card-small); padding: var(--padding-2x-small-4) 0; }
.cat:hover { background: var(--interaction-neutral-light-hover); }
.cat img { width: 48px; height: 48px; object-fit: contain; }
.pager { display: flex; justify-content: center; gap: 0; padding: var(--padding-small-12) 0 0; }
.pager i { width: 16px; height: 4px; border-radius: var(--radius-pill); background: var(--background-tertiary); }
.pager i:first-child { background: var(--background-brand); }

/* ---------- Section (shared by new + host) ---------- */
.section { position: relative; overflow: hidden; transition: height .3s ease, opacity .3s ease; }
.sec-head { display: flex; align-items: flex-start; gap: var(--gap-x-small-8); padding: 24px var(--padding-medium-16) var(--padding-small-12); }
.sec-title { flex: 1; min-width: 0; }
.sec-title .row { display: flex; align-items: center; gap: var(--gap-2x-small-4); }
.sec-title .row button { display: inline-flex; align-items: center; gap: var(--gap-2x-small-4); text-align: left; border-radius: var(--radius-card-small); }
.sec-title .sub { color: var(--text-secondary); margin-top: var(--padding-min-2); }
.chev { width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--button-tonal-neutral); }
.chev .ds-icon { width: 16px; height: 16px; }
.close-btn {
  width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: var(--radius-pill);
  background: var(--button-blank); border: 1px solid var(--border-regular); transition: background .15s ease;
}
.close-btn:hover { background: var(--interaction-neutral-light-hover); }
.close-btn:active { background: var(--interaction-neutral-light-pressed); }
.close-btn .ds-icon { width: 20px; height: 20px; color: var(--icon-secondary); }

.hscroll { display: flex; gap: var(--gap-x-small-8); padding: 0 var(--padding-medium-16) var(--padding-x-small-8); overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding: 0 var(--padding-medium-16); }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll.dragging { scroll-snap-type: none; cursor: grabbing; }
.hscroll > * { scroll-snap-align: start; }

/* Vertical ad card (reused from host) */
.card { width: 158px; flex: none; text-align: left; display: flex; flex-direction: column; border-radius: var(--radius-card-small); transition: transform .12s ease; }
.card:active { transform: scale(.98); }
.thumb { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-card-small); overflow: hidden; background: var(--background-secondary); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
.thumb .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--background-overlay)); }
.thumb .meta { position: absolute; left: var(--padding-x-small-8); right: var(--padding-x-small-8); bottom: var(--padding-2x-small-6); display: flex; justify-content: space-between; align-items: center; color: var(--text-blank); }
.thumb .meta span:last-child { display: inline-flex; align-items: center; gap: var(--gap-min-2); }
.thumb .meta .ds-icon { color: var(--icon-blank); }
.fav {
  position: absolute; top: var(--padding-2x-small-4); right: var(--padding-2x-small-4); width: 32px; height: 32px;
  display: grid; place-items: center; border-radius: var(--radius-pill);
}
.fav .ds-icon { color: var(--icon-blank); filter: drop-shadow(0 1px 2px var(--background-overlay)); transition: transform .2s ease; }
.fav.on .ds-icon { color: var(--icon-error); }
.fav.pop .ds-icon { transform: scale(1.25); }
.c-title { margin-top: var(--padding-x-small-8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text-primary); }
.c-param { color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-param span + span::before { content: ""; display: inline-block; width: var(--gap-x-small-8); }
.c-price { color: var(--text-error); }

/* "Xem tất cả" tile (edge: >10 tin) */
.seeall {
  width: 158px; height: 158px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap-x-small-8);
  border-radius: var(--radius-card-small); background: var(--background-secondary); color: var(--text-primary); transition: background .15s ease;
}
.seeall:hover { background: var(--interaction-neutral-light-hover); }
.seeall .circ { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--button-blank); border: 1px solid var(--border-regular); }
.seeall small { color: var(--text-secondary); }

/* Horizontal ad card (edge: chỉ 1 tin) */
.hcard { display: flex; gap: var(--gap-small-12); margin: 0 var(--padding-medium-16) var(--padding-x-small-8); text-align: left; border-radius: var(--radius-card-small); transition: transform .12s ease; }
.hcard:active { transform: scale(.99); }
.hcard .thumb { width: 120px; flex: none; }
.hcard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap-2x-small-4); }
.hcard .c-title { margin-top: 0; }
.hcard .when { margin-top: auto; color: var(--text-tertiary); }

/* Skeleton (edge: loading) */
.sk { background: var(--skeleton-item); border-radius: var(--radius-ad-small); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--background-overlay-inverted), var(--background-primary), transparent); opacity: .7; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-card { width: 158px; flex: none; display: flex; flex-direction: column; gap: var(--gap-x-small-8); }
.sk-card .sk.img { aspect-ratio: 1 / 1; border-radius: var(--radius-card-small); }
.sk.l1 { height: 16px; } .sk.l2 { height: 16px; width: 70%; } .sk.l3 { height: 20px; width: 50%; }
.sk.t1 { height: 20px; width: 160px; } .sk.t2 { height: 16px; width: 200px; margin-top: var(--padding-2x-small-6); }

/* ---------- Host: tabs + feed ---------- */
.tabs { display: flex; justify-content: space-between; padding: 24px var(--padding-medium-16) var(--padding-medium-16); }
.tabs button { color: var(--text-tertiary); position: relative; }
.tabs button.on { color: var(--text-primary); }
.tabs .ds-icon { position: absolute; top: -6px; right: -12px; width: 16px; height: 16px; color: var(--icon-info); }
.feed { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-medium-16) var(--gap-small-12); padding: 0 var(--padding-medium-16) var(--padding-medium-16); }
.feed .card { width: auto; }
.loc { display: flex; gap: var(--gap-2x-small-4); align-items: flex-start; margin-top: var(--padding-x-small-8); color: var(--text-tertiary); }
.loc span { flex: 1; min-width: 0; }

/* ---------- Bottom nav ---------- */
.nav { position: sticky; bottom: 0; z-index: 20; margin-top: auto; background: var(--background-primary); border-top: 1px solid var(--border-thin); }
.nav .items { display: grid; grid-template-columns: repeat(5, 1fr); height: 56px; }
.nav .it { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap-min-2); color: var(--text-tertiary); }
.nav .it .ds-icon { color: var(--icon-tertiary); }
.nav .it.on { color: var(--text-primary); }
.nav .it.on .ds-icon { color: var(--icon-brand); }
.nav .post .plus { width: 48px; height: 48px; margin-top: -24px; display: grid; place-items: center; border-radius: var(--radius-pill); background: var(--button-primary); box-shadow: 0 0 0 4px var(--background-primary); transition: background .15s ease; }
.nav .post:hover .plus { background: var(--interaction-brand-hover); }
.nav .post .plus .ds-icon { color: var(--icon-on-background); }
.nav .post { color: var(--text-primary); }
.nav .ava { width: 24px; height: 24px; border-radius: var(--radius-pill); object-fit: cover; }
.home-indicator { /* ds-raw: khung máy */ width: 134px; height: 5px; margin: 6px auto 8px; border-radius: 3px; background: rgba(0,0,0,.85); }

/* ---------- Drawer xác nhận ẩn ---------- */
.scrim { position: absolute; inset: 0; z-index: 50; background: var(--background-overlay); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.drawer {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--background-primary);
  border-radius: var(--radius-modal) var(--radius-modal) 0 0; box-shadow: 0 4px 16px var(--background-overlay);
  transform: translateY(100%); transition: transform .3s ease;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .drawer { transform: none; }
.dr-head { height: 48px; display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 0 var(--padding-x-small-8); border-bottom: 1px solid var(--border-thin); text-align: center; }
.dr-head .icon-btn:hover { background: var(--interaction-neutral-light-hover); }

   <div class="sheet">

     <button class="cat t-body-section"><img src="assets/cat-bds.png" alt="">Bất động sản</button>

    </div>
    <div class="pager" data-ds-context="reference"><i></i><i></i></div>

    <!-- ===== NEW: Tin đăng đã xem ===== -->
    <section class="section" id="viewed" aria-labelledby="viewedTitle"
      data-ds="Section · Tin đăng đã xem" data-ds-mode="partial" data-ds-screen="gds-home"
      data-ds-insert="before:section-chungcu-quan-phu-nhuan" data-ds-gap="?? confirm"
      data-ds-visible-if="viewed_ads_valid_count >= 1">
     <div class="sec-head" data-ds-pad="24 · padding-medium-16 · padding-small-12">
      <div class="sec-title">
       <div class="row">
        <button id="viewedTitle" class="t-header-section" data-ds-typo="header-section" data-ds-color="text-primary" data-ds-on-tap="open:viewed-history">Tin đăng đã xem
         <span class="chev" data-ds="Icon Button" data-ds-type="Secondary" data-ds-size="S-24" data-ds-pill="true" data-ds-icon="Chevronright-outline"><svg class="ds-icon" aria-hidden="true"><use href="#ds-Chevronright-outline"/></svg></span>
        </button>
       </div>
       <p class="sub t-body-section" data-ds-typo="body-section" data-ds-color="text-secondary" data-ds-speculative="true">Xem lại những tin bạn quan tâm</p>
      </div>
      <button class="close-btn" id="viewedClose" aria-label="Ẩn mục Tin đăng đã xem" data-ds="Icon Button" data-ds-type="Tertiary" data-ds-size="M-32" data-ds-state="Active" data-ds-pill="true" data-ds-icon="Close-outline" data-ds-on-tap="open:drawer-hide-viewed"><svg class="ds-icon" aria-hidden="true"><use href="#ds-Close-outline"/></svg></button>

    <!-- ===== Host: Chung cư Quận Phú Nhuận (reference) ===== -->
    <section class="section" id="chungcu" data-ds-context="reference">

  <!-- ===== NEW: Drawer xác nhận ẩn section ===== -->
  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle"
    data-ds="Drawer" data-ds-surface="bottom-sheet" data-ds-dismiss="close-icon | scrim | Huỷ">
   <div class="dr-head" data-ds-pad="padding-x-small-8">
    <button class="icon-btn" id="drClose" aria-label="Đóng" data-ds="Icon Button" data-ds-type="Ghost" data-ds-size="L-40" data-ds-pill="true" data-ds-icon="Close-outline"><svg class="ds-icon" aria-hidden="true"><use href="#ds-Close-outline"/></svg></button>
    <h2 id="drTitle" class="t-header-section" data-ds-typo="header-section" data-ds-color="text-primary">Ẩn mục Tin đăng đã xem?</h2>

   <p class="dr-body t-body-section" data-ds-typo="body-section" data-ds-color="text-secondary">Mục này sẽ không hiện trên Trang chủ nữa. Lịch sử xem tin của bạn vẫn được giữ nguyên.</p>
   <div class="dr-foot" data-ds-gap="gap-x-small-8">
    <button class="btn secondary t-label-section" id="drCancel" data-ds="Button" data-ds-type="Secondary" data-ds-size="L-40" data-ds-state="Active" data-ds-pill="false" data-ds-typo="label-section">Huỷ</button>
    <button class="btn primary t-label-section" id="drConfirm" data-ds="Button" data-ds-type="Primary" data-ds-size="L-40" data-ds-state="Active" data-ds-pill="false" data-ds-typo="label-section">Ẩn mục này</button>
   </div>
  </div>
 </div>
</div>

<script>
(function () {
  const IMG = { kingston: 'assets/kingston.jpg', garden: 'assets/garden.jpg', auco1: 'assets/auco1.jpg', auco2: 'assets/auco2.jpg', iphone: 'assets/iphone.jpg', car: 'assets/car.jpg' };
  // Mock: tin user đã xem, mới xem nhất đứng đầu. status: active | sold | hidden | expired
  const VIEWED = [
    { id: 1, img: 'kingston', t: 'Bán căn hộ Kingston - 2Pn giá 6.5 tỷ - 3PN giá 8 tỷ', p: ['2 PN', 'Hướng Nam', 'Chung cư'], price: '6,5 tỷ', when: '19 giờ trước', n: 3 },
    { id: 2, img: 'iphone', t: '14ProMax 128/256 Quốc Tế Zin góp 0đ Bao Nợ Xấu', p: ['iPhone 14 Pro Max', '128 GB'], price: '14.300.000 đ', when: 'Tin tiêu biểu', n: 5 },
    { id: 3, img: 'car', t: 'Hyundai Stargazer 2024 7 chỗ 4 vạn Trắng', p: ['2024', '4 km', 'Xăng', 'Tự động'], price: '460.000.000 đ', when: 'hôm qua', n: 5 },
    { id: 4, img: 'garden', t: 'Bán căn hộ Garden Gate - 75m2/2PN giá 7,3 tỷ', p: ['2 PN', 'Hướng Nam', 'Chung cư'], price: '7,3 tỷ', when: 'hôm qua', n: 5 },
    { id: 5, img: 'auco1', t: 'Chính chủ bán căn hộ Âu Cơ tower, căn góc 3 pn', p: ['3 PN', 'Hướng Tây Bắc', 'Chung cư'], price: '4,55 tỷ', when: '4 ngày trước', n: 5 },
    { id: 6, img: 'auco2', t: 'Chính chủ cần bán căn hộ CC Âu cơ Tower, dt: 98m2', p: ['3 PN', 'Chung cư'], price: '3,8 tỷ', when: '23 giờ trước', n: 6 },
    { id: 7, img: 'iphone', t: 'iPhone 14 Pro 256GB VN/A pin 92% fullbox', p: ['iPhone 14 Pro', '256 GB'], price: '17.500.000 đ', when: '2 ngày trước', n: 4 },
    { id: 8, img: 'kingston', t: 'Cho thuê căn hộ Kingston 1PN full nội thất', p: ['1 PN', 'Chung cư'], price: '15 triệu/tháng', when: '3 ngày trước', n: 7 },
    { id: 9, img: 'car', t: 'Hyundai Stargazer X 2024 bản cao cấp', p: ['2024', '12.000 km', 'Xăng'], price: 'Thỏa thuận', when: '5 ngày trước', n: 8 },
    { id: 10, img: 'garden', t: 'Garden Gate 3PN view công viên, sổ hồng', p: ['3 PN', 'Hướng Đông'], price: '9,1 tỷ', when: '1 tuần trước', n: 6 },
    { id: 11, img: 'auco1', t: 'Căn hộ Âu Cơ Tower 2PN nhà mới', p: ['2 PN', 'Chung cư'], price: '3,2 tỷ', when: '1 tuần trước', n: 3 },
    { id: 12, img: 'auco2', t: 'Bán gấp căn hộ Âu Cơ 86m2', p: ['2 PN', 'Chung cư'], price: '3,5 tỷ', when: '2 tuần trước', n: 5 },
  ];
  const CHUNGCU = [
    { img: 'kingston', t: 'Bán căn hộ Kingston - 2Pn giá 6.5 tỷ - 3PN giá 8 tỷ', p: ['2 PN', 'Hướng Nam', 'Chung cư'], price: '6,5 tỷ', when: '19 giờ trước', n: 3 },
    { img: 'garden', t: 'Bán căn hộ Garden Gate - 75m2/2PN giá 7,3 tỷ', p: ['2 PN', 'Hướng Nam', 'Chung cư'], price: '7,3 tỷ', when: 'hôm qua', n: 5 },
    { img: 'auco2', t: 'Bán căn hộ Nguyễn Kim 2PN full nội thất', p: ['2 PN', 'Chung cư'], price: '6,7 tỷ', when: '3 ngày trước', n: 4 },
  ];
  const FEED = [
    { img: 'auco1', t: 'Chính chủ bán căn hộ Âu Cơ tower, căn góc 3 pn', p: ['3 PN', 'Hướng Tây Bắc', 'Chung cư'], price: '4,55 tỷ', when: '4 ngày trước', n: 5, loc: 'Q. Tân Phú (P. Phú Thọ Hòa mới)' },
    { img: 'iphone', t: '14ProMax 128/256 Quốc Tế Zin góp 0đ Bao Nợ Xấu', p: ['iPhone 14 Pro Max', '128 GB'], price: '14.300.000 đ', when: 'Tin tiêu biểu', n: 5, loc: 'Thành phố Thủ Đức (P. Thủ Đức mới)' },
    { img: 'auco2', t: 'Chính chủ cần bán căn hộ CC Âu cơ Tower, dt: 98m2', p: ['3 PN', 'Chung cư'], price: '3,8 tỷ', when: '23 giờ trước', n: 6, loc: 'Q. Tân Phú (P. Tân Sơn Nhì)' },
    { img: 'car', t: 'Hyundai Stargazer 2024 7 chỗ 4 vạn Trắng', p: ['2024', '4 km', 'Xăng', 'Tự động'], price: '460.000.000 đ', when: 'hôm qua', n: 5, loc: 'Q. Gò Vấp (P. 5)' },
  ];
  // Dataset per state (raw list BEFORE business rules are applied)
  const SETS = {
    default: () => VIEWED.slice(0, 6),
    many: () => VIEWED.slice(0, 12),
    one: () => VIEWED.slice(0, 1),
    two: () => VIEWED.slice(0, 2),
    empty: () => [],
    filtered: () => [
      { ...VIEWED[2], status: 'sold' }, { ...VIEWED[0] }, { ...VIEWED[4], status: 'hidden' }, { ...VIEWED[5], status: 'expired' },
    ],
    loading: () => VIEWED.slice(0, 6),
    hidden: () => VIEWED.slice(0, 6),
  };
  const MAX = 10;

  const $ = s => document.querySelector(s);
  const icon = (id, cls = '') => `<svg class="ds-icon ${cls}" aria-hidden="true"><use href="${'#ds-' + id}"/></svg>`;
  const params = p => p.map(x => `<span>${x}</span>`).join('');
  const thumb = (a, favId) => `
    <div class="thumb" data-ds-radius="radius-card-small">
      <img src="${IMG[a.img]}" alt="" loading="lazy" onerror="this.remove()">
      <div class="shade"></div>
      <div class="meta t-tagline-annotation" data-ds-typo="tagline-annotation" data-ds-color="text-blank"><span>${a.when}</span><span>${a.n}${icon('Image-outline', 'ds-icon--16')}</span></div>
      <span class="fav" role="button" tabindex="0" aria-label="Lưu tin" aria-pressed="false" data-fav="${favId || ''}" data-ds="Icon Button" data-ds-type="Ghost" data-ds-size="M-32" data-ds-icon="Heart-outline">${icon('Heart-outline')}</span>
    </div>`;
  const vCard = (a, extra = '') => `
    <a class="card" href="#" ${extra} data-ds="Ad Card · vertical" data-ds-on-tap="open:adview">
      ${thumb(a, a.id)}
      <span class="c-title t-body-section" data-ds-typo="body-section" data-ds-color="text-primary" data-ds-content-rule="max-2-lines, ellipsis">${a.t}</span>
      <span class="c-param t-body-caption" data-ds-typo="body-caption" data-ds-color="text-tertiary" data-ds-content-rule="1-line, ellipsis">${params(a.p)}</span>
      <span class="c-price t-display-price" data-ds-typo="display-price" data-ds-color="text-error">${a.price}</span>
    </a>`;
  const hCard = a => `
    <a class="hcard" href="#" data-ds="Ad Card · horizontal" data-ds-composite="Ad Card thumb 120 + title/param/price stack" data-ds-gap="gap-small-12" data-ds-on-tap="open:adview">
      ${thumb(a, a.id)}
      <span class="info">
        <span class="c-title t-body-section" data-ds-typo="body-section" data-ds-color="text-primary" data-ds-content-rule="max-2-lines, ellipsis">${a.t}</span>
        <span class="c-param t-body-caption" data-ds-typo="body-caption" data-ds-color="text-tertiary">${params(a.p)}</span>
        <span class="c-price t-display-price" data-ds-typo="display-price" data-ds-color="text-error">${a.price}</span>
      </span>
    </a>`;
  const seeAll = total => `
    <a class="seeall" href="#" data-ds="See-all tile" data-ds-composite="Icon Button L-40 Tertiary pill + label" data-ds-on-tap="open:viewed-history">
      <span class="circ">${icon('Arrowright-outline', 'ds-icon--20')}</span>
      <span class="t-label-section" data-ds-typo="label-section">Xem tất cả</span>
      <small class="t-body-caption" data-ds-typo="body-caption" data-ds-color="text-secondary">${total} tin đã xem</small>
    </a>`;
  const skeleton = () => `<div class="hscroll" aria-busy="true" aria-label="Đang tải tin đã xem">${'<div class="sk-card"><div class="sk img"></div><div class="sk l1"></div><div class="sk l2"></div><div class="sk l3"></div></div>'.repeat(3)}</div>`;

  /* Business rules: lọc tin không còn hiệu lực → đếm → chọn layout */
  function resolve(raw) {
    const valid = raw.filter(a => !a.status || a.status === 'active');
    return { valid, shown: valid.slice(0, MAX), total: valid.length };
  }

  const sec = $('#viewed'), body = $('#viewedBody');
  let timer;
  function showSection(on) {
    sec.classList.remove('collapsed'); sec.style.height = ''; sec.style.opacity = '';
    sec.hidden = !on;
  }
  function render(state) {
    clearTimeout(timer);
    document.documentElement.dataset.state = state;
    if (state === 'hidden') { showSection(false); sec.classList.add('collapsed'); return; }
    if (state === 'loading') {
      showSection(true);
      body.innerHTML = skeleton();
      setHead(true);
      if (!document.documentElement.classList.contains('artboard')) timer = setTimeout(() => render('default'), 1500);
      return;
    }
    setHead(false);
    const { shown, total } = resolve(SETS[state]());
    if (total === 0) { showSection(false); body.innerHTML = ''; return; }
    showSection(true);
    if (total === 1) body.innerHTML = hCard(shown[0]);
    else body.innerHTML = `<div class="hscroll">${shown.map(a => vCard(a)).join('')}${total > MAX ? seeAll(total) : ''}</div>`;
    wire(body);
  }
  // Header skeleton while loading
  const headEl = sec.querySelector('.sec-head'), headHTML = headEl.innerHTML;
  function setHead(loading) {
    if (loading) headEl.innerHTML = '<div class="sec-title"><div class="sk t1"></div><div class="sk t2"></div></div>';
    else if (headEl.innerHTML !== headHTML) { headEl.innerHTML = headHTML; $('#viewedClose').onclick = openDrawer; }
  }

  /* Host sections */
  $('#chungcuList').innerHTML = CHUNGCU.map(a => vCard(a)).join('');
  $('#feed').innerHTML = FEED.map(a => vCard(a).replace('</a>', `<span class="loc t-body-caption">${icon('Location-outline', 'ds-icon--16')}<span>${a.loc}</span>${icon('Morevertical-outline', 'ds-icon--20')}</span></a>`)).join('');

  /* Interactions */
  const favs = new Set();
  function wire(root) {
    root.querySelectorAll('.hscroll').forEach(dragScroll);
  }
  document.addEventListener('click', e => {
    const f = e.target.closest('.fav');
    if (f) {
      e.preventDefault(); e.stopPropagation();
      const on = !f.classList.contains('on'); f.classList.toggle('on', on); f.setAttribute('aria-pressed', on);
      f.querySelector('use').setAttribute('href', on ? '#ds-Heart-fill' : '#ds-Heart-outline');
      f.classList.add('pop'); setTimeout(() => f.classList.remove('pop'), 200);
      return;
    }
    if (e.target.closest('a')) e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('fav')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape') closeDrawer();
  });
  function dragScroll(el) {
    let d = null, moved = false;
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; d = { x: e.clientX, s: el.scrollLeft }; moved = false; });
    el.addEventListener('pointermove', e => {
      if (!d) return; const dx = e.clientX - d.x;
      if (Math.abs(dx) > 4) { moved = true; el.classList.add('dragging'); }
      el.scrollLeft = d.s - dx;
    });
    const end = () => { if (!d) return; d = null; el.classList.remove('dragging'); };
    el.addEventListener('pointerup', end); el.addEventListener('pointerleave', end);
    el.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  }
  wire(document);

  const screen = $('#screen');
  function openDrawer() { screen.classList.add('open'); setTimeout(() => $('#drConfirm').focus({ preventScroll: true }), 300); }
  function closeDrawer() { screen.classList.remove('open'); }
  $('#viewedClose').onclick = openDrawer;
  $('#scrim').onclick = closeDrawer; $('#drClose').onclick = closeDrawer; $('#drCancel').onclick = closeDrawer;
  $('#drConfirm').onclick = () => {
    closeDrawer();
    sec.style.height = sec.offsetHeight + 'px';
    requestAnimationFrame(() => { sec.style.height = '0px'; sec.style.opacity = '0'; });
    setTimeout(() => { render('hidden'); notify('hidden'); }, 320);
  };

  /* Sticky header turns white on scroll */
  const scroll = $('#scroll'), topbar = $('#topbar');
  scroll.addEventListener('scroll', () => topbar.classList.toggle('scrolled', scroll.scrollTop > 40), { passive: true });

  function notify(state) { try { parent.postMessage({ type: 'viewed-state', state }, '*'); } catch (e) {} }

  /* Public API for the canvas */
  window.setViewedState = s => { closeDrawer(); scroll.scrollTop = 0; render(s); };
  window.openHideDrawer = () => { screen.classList.add('open'); };

  /* Boot from <html data-*> (canvas artboards) */
  const ds = document.documentElement.dataset;
  render(ds.state || 'loading');
  if (ds.drawer === 'open') screen.classList.add('open');
  const after = () => {
    if (ds.scrollEnd) body.querySelectorAll('.hscroll').forEach(h => h.scrollLeft = h.scrollWidth);
    if (ds.scrollY) scroll.scrollTop = +ds.scrollY;
  };
  after(); addEventListener('load', after);
})();
</script>
